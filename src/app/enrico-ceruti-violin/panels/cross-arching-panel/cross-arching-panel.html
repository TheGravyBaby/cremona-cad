@if (params.arching) {

<section class="ui-group">
    <div class="ui-group-title">Cross Section</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Station Height <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" min="1" [max]="params.height - 1"
                [(ngModel)]="flags.crossSectionY" (input)="onChange()" />
        </label>
        <button type="button" class="info-icon" (click)="crossSectionStationInfo()" title="More information">ⓘ</button>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <input class="basic-input" type="range" step="1" min="1" [max]="params.height - 1"
            [(ngModel)]="flags.crossSectionY" (input)="onChange()"
            aria-label="Cross section station height" />
    </div>
</section>

@if (arching.top.cross) {
<section class="ui-group" [style.border-color]="colors.outerTrace">
    <div class="ui-group-title">Top Plate</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Cycloid Factor <span class="unit-label">0–1</span></span>
            <input class="basic-input" type="number" step="0.05" min="0" max="1"
                [(ngModel)]="topCross.d" (input)="onChange()" [style.border-color]="colors.archTop" />
        </label>
        <button type="button" class="info-icon" (click)="trochoidFactorInfo()" title="More information">ⓘ</button>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Edge Depth <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.1" min="0" max="5"
                [(ngModel)]="arching.top.edgeDepth" (input)="onChange()" [style.border-color]="colors.archTop" />
        </label>
        <button type="button" class="info-icon" (click)="crossArchEdgeDepthInfo()" title="More information">ⓘ</button>
    </div>
</section>
}

@if (arching.top.fluting) {
<section class="ui-group" [style.border-color]="colors.fluting">
    <div class="ui-group-title">Fluting Channel</div>
    <div class="input-group basic-row field-row" role="group">
        <div class="toggle">
            <input type="checkbox" [(ngModel)]="troughAuto" (change)="onChange()" />
            <span>Trough on Purfling Line</span>
        </div>
        <button type="button" class="info-icon" (click)="troughPositionInfo()" title="More information">ⓘ</button>
    </div>
    @if (!troughAuto) {
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Trough Position <span class="unit-label">0–1</span></span>
            <input class="basic-input" type="number" step="0.05" min="0.05" max="0.95"
                [(ngModel)]="topFluting.troughT" (input)="onChange()" [style.border-color]="colors.fluting" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <input class="basic-input" type="range" step="0.01" min="0.05" max="0.95"
            [(ngModel)]="topFluting.troughT" (input)="onChange()"
            aria-label="Fluting trough position" />
    </div>
    }
</section>
}

<section class="ui-group">
    <div class="input-group basic-row field-row" role="group">
        <div class="toggle">
            <input type="checkbox" [(ngModel)]="flags.showArchContours" (change)="onChange()" />
            <span>Show Contour Map</span>
        </div>
        <button type="button" class="info-icon" (click)="archContoursInfo()" title="More information">ⓘ</button>
    </div>
</section>



}
