@let top = params.arching?.top?.fluting;
@let back = params.arching?.bottom?.fluting;
@if (top && back) {

<section class="ui-group">
    <div class="ui-group-title">Channel</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Land Edge <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" min="0"
                [(ngModel)]="params.outerFlutingDepth" (input)="onChange()"
                [style.border-color]="pal.neutral"
                docTip="fluting.landEdge" />
        </label>
        <button type="button" class="info-icon" (click)="help('gougeCenterline')" title="More information">ⓘ</button>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <div class="toggle" docTip="fluting.gougeCorners">
                <input type="checkbox" [(ngModel)]="top.cornerGouge" (change)="emitImmediate()" />
                <span>Corners</span>
            </div>
        </label>
        <button type="button" class="info-icon" (click)="help('cornerGouge')" title="More information">ⓘ</button>
    </div>
</section>

<section class="ui-group" [style.border-color]="pal.ink(4)">
    <div class="ui-group-title">Top Plate</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Sweep <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" min="0.1"
                [(ngModel)]="top.sweepRadius" (input)="onChange()"
                [style.border-color]="pal.ink(4)"
                docTip="fluting.sweep" />
        </label>
        <label class="field-cell">
            <span class="field-title">Depth <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" min="0"
                [(ngModel)]="top.depth" (input)="onChange()"
                [style.border-color]="pal.ink(4)"
                docTip="fluting.depth" />
        </label>
        <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <div class="basic-display" aria-label="Channel width value">{{ 2 * gougeHalfWidth(top.sweepRadius, top.depth) | number:'1.1-1' }}</div>
        </label>
        <button type="button" class="info-icon" (click)="help('gougeSection')" title="More information">ⓘ</button>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <div class="toggle" docTip="fluting.cBout">
                <input type="checkbox" [ngModel]="top.sweepRadius_cBout !== null"
                    (ngModelChange)="top.sweepRadius_cBout = $event ? top.sweepRadius : null; emitImmediate()" /><span>C Bout</span>
            </div>
        </label>
        @if (top.sweepRadius_cBout !== null) {
        <label class="field-cell">
            <span class="field-title">Sweep <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" min="0.1"
                [(ngModel)]="top.sweepRadius_cBout" (input)="onChange()"
                [style.border-color]="pal.ink(4)"
                docTip="fluting.cBoutSweep" />
        </label>
        <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <div class="basic-display" aria-label="C-bout channel width value">{{ 2 * gougeHalfWidth(effectiveCBoutSweep(top), top.depth) |
                number:'1.1-1' }}</div>
        </label>
        }
        <button type="button" class="info-icon" (click)="help('gougeCBout')" title="More information">ⓘ</button>
    </div>
</section>

<section class="ui-group" [style.border-color]="pal.ink(1)">
    <div class="ui-group-title">Back Plate</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Sweep <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" min="0.1"
                [(ngModel)]="back.sweepRadius" (input)="onChange()"
                [style.border-color]="pal.ink(1)"
                docTip="fluting.sweep" />
        </label>
        <label class="field-cell">
            <span class="field-title">Depth <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" min="0"
                [(ngModel)]="back.depth" (input)="onChange()"
                [style.border-color]="pal.ink(1)"
                docTip="fluting.depth" />
        </label>
        <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <div class="basic-display" aria-label="Channel width value">{{ 2 * gougeHalfWidth(back.sweepRadius, back.depth) | number:'1.1-1' }}
            </div>
        </label>
        <button type="button" class="info-icon" (click)="help('gougeSection')" title="More information">ⓘ</button>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <div class="toggle" docTip="fluting.cBout">
                <input type="checkbox" [ngModel]="back.sweepRadius_cBout !== null"
                    (ngModelChange)="back.sweepRadius_cBout = $event ? back.sweepRadius : null; emitImmediate()" /><span>C Bout</span>
            </div>
        </label>
        @if (back.sweepRadius_cBout !== null) {
        <label class="field-cell">
            <span class="field-title">Sweep <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" min="0.1"
                [(ngModel)]="back.sweepRadius_cBout" (input)="onChange()"
                [style.border-color]="pal.ink(1)"
                docTip="fluting.cBoutSweep" />
        </label>
        <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <div class="basic-display" aria-label="C-bout channel width value">{{ 2 * gougeHalfWidth(effectiveCBoutSweep(back), back.depth) |
                number:'1.1-1' }}</div>
        </label>
        }
        <button type="button" class="info-icon" (click)="help('gougeCBout')" title="More information">ⓘ</button>
    </div>
</section>

}
