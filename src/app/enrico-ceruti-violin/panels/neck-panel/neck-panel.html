    @if (params.neck) {

    <section class="ui-group" [style.border-color]="pal.ink(0)">
        <div class="ui-group-title">Neck</div>
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">Length <span class="unit-label">mm</span></span>
                <input class="basic-input" type="number" step="1" min="1" [style.border-color]="pal.ink(0)"
                    [(ngModel)]="neck.length" (input)="onChange()" (focus)="onFieldFocus('length', pal.ink(0))"
                    (blur)="onFieldBlur()" />
            </label>
            <label class="field-cell">
                <span class="field-title">Thickness <span class="unit-label">mm</span></span>
                <input class="basic-input" type="number" step="0.5" min="1" [style.border-color]="pal.ink(0).faint(3)"
                    [(ngModel)]="neck.thickness" (input)="onChange()" (focus)="onFieldFocus('thickness', pal.ink(0).faint(3))"
                    (blur)="onFieldBlur()" />
            </label>
        </div>
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">Top Width <span class="unit-label">mm</span></span>
                <input class="basic-input" type="number" step="0.5" min="1" [style.border-color]="pal.ink(0).faint(-3)"
                    [(ngModel)]="neck.topWidth" (input)="onChange()" (focus)="onFieldFocus('topWidth', pal.ink(0).faint(-3))"
                    (blur)="onFieldBlur()" />
            </label>
            <label class="field-cell">
                <span class="field-title">Neck Projection <span class="unit-label">°</span></span>
                <input class="basic-input" type="number" step="0.5" min="0" max="30" [ngModel]="angleDeg"
                    (ngModelChange)="setAngleDeg($event)" (focus)="onFieldFocus('angle', pal.ink(0))"
                    (blur)="onFieldBlur()" />
            </label>
        </div>
    </section>

    <section class="ui-group" [style.border-color]="pal.ink(1)">
        <div class="ui-group-title">Neck Root</div>
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">Heel Radius <span class="unit-label">mm</span></span>
                <input class="basic-input" type="number" step="1" min="1" [style.border-color]="pal.ink(1)"
                    [(ngModel)]="neck.heel.r" (input)="onChange()" (focus)="onFieldFocus('heel', pal.ink(1))"
                    (blur)="onFieldBlur()" />
            </label>
            <label class="field-cell">
                <span class="field-title">Button Height <span class="unit-label">mm</span></span>
                <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pal.ink(2)"
                    [(ngModel)]="params.button.height" (input)="onChange()"
                    (focus)="onFieldFocus('buttonHeight', pal.ink(2))" (blur)="onFieldBlur()" />
            </label>

        </div>
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">Mortise <span class="unit-label">mm</span></span>
                <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pal.ink(1).faint(-3)"
                    [(ngModel)]="neck.mortiseDepth" (input)="onChange()" (focus)="onFieldFocus('mortise', pal.ink(1).faint(-3))"
                    (blur)="onFieldBlur()" />
            </label>
            <label class="field-cell">
                <span class="field-title">Overstand <span class="unit-label">mm</span></span>
                <input class="basic-input" type="number" step="0.5" min="0"
                    [(ngModel)]="neck.overstand" (input)="onChange()" (focus)="onFieldFocus('overstand', pal.ink(1))"
                    (blur)="onFieldBlur()" />
            </label>
        </div>
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">Root Width <span class="unit-label">mm</span></span>
                <input class="basic-input" type="number" step="0.5" min="1" [style.border-color]="pal.ink(1).faint(3)"
                    [(ngModel)]="neck.rootWidth" (input)="onChange()" (focus)="onFieldFocus('rootWidth', pal.ink(1).faint(3))"
                    (blur)="onFieldBlur()" />
            </label>
        </div>

    </section>

    }
