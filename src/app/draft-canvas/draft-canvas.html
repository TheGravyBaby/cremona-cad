<div class="canvas-shell" [class.dark-mode]="isDarkMode">
  <div #host class="host" [class.drawing]="activeTool !== null" tabindex="0" aria-label="Draft canvas" (wheel)="onScrollWheel($event)"
    (pointerdown)="onPointerDown($event)" (pointermove)="onPointerMove($event)" (pointerup)="onPointerUp($event)"
    (pointerleave)="onPointerUp($event)" (keydown)="onKeyDown($event)" (dblclick)="onDoubleClick($event)">
    @if (editingTextShapeId) {
      <textarea #textEditArea class="text-edit-overlay"
        [rows]="editingTextRows"
        [style.left.px]="editingTextScreenX"
        [style.top.px]="editingTextScreenY"
        [style.color]="editingTextColor"
        (input)="onTextEditInput($any($event.target).value)"
        (keydown)="onTextEditKeyDown($event)"
        (blur)="finishEditingText()"
        (pointerdown)="$event.stopPropagation()"
        (pointerup)="$event.stopPropagation()"
        spellcheck="false"></textarea>
    }
  </div>

  <input #imageFileInput type="file" accept="image/*" style="display:none"
    (change)="onImageFileSelected($event)" />

  <app-tool-palette (selectImageRequested)="selectShapeById($event)"></app-tool-palette>

  <div class="ui-controls">
    <div class="left">
      <!-- <button type="button" class="btn" (click)="darkMode()">Dark Mode</button> -->

      <app-settings-bar [activeTool]="activeTool" [selectedShape]="selectedShape"
        [selectedShapes]="selectedShapes"></app-settings-bar>
    </div>

    <div class="right">
      <!-- Debug, localhost only (see isLocalHost in helpers/debugDump.ts): everything drawn, to the clipboard. -->
      @if (debugDumpEnabled) {
      <button type="button" class="btn debug-dump-btn" (click)="copyCanvasDebugDump()" title="Copy drawn geometry">/</button>
      }
      <button type="button" class="btn theme-toggle-btn" (click)="nightModeChange.emit(!nightMode)"
        [attr.aria-pressed]="nightMode"
        [attr.aria-label]="nightMode ? 'Switch to day mode' : 'Switch to night mode'"
        [title]="nightMode ? 'Switch to day mode' : 'Switch to night mode'">
        @if (nightMode) {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
        </svg>
        } @else {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" />
        </svg>
        }
      </button>

       <div class="axis-controls">
        <button type="button" class="btn axis-toggle-btn" [class.active]="axisPopupOpen" (click)="toggleAxisPopup()"
          title="Axis &amp; grid settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20V4" />
            <path d="M1.5 8L4 4l2.5 4" />
            <path d="M4 20h16" />
            <path d="M16 22.5L20 20l-4-2.5" />
          </svg>
        </button>
        @if(axisPopupOpen) {
        <div class="axis-popup">
          <div class="row">
            <label>X Step (mm)</label>
            <input type="number" min="0.1" step="0.1" [ngModel]="gridStepX" (ngModelChange)="gridStepX = $event" />
          </div>
          <div class="row">
            <label>Y Step (mm)</label>
            <input type="number" min="0.1" step="0.1" [ngModel]="gridStepY" (ngModelChange)="gridStepY = $event" />
          </div>
          <label class="chk">
            <input type="checkbox" [ngModel]="showAxes" (ngModelChange)="showAxes = $event" />
            Axis
          </label>
          <label class="chk">
            <input type="checkbox" [ngModel]="showGridX" (ngModelChange)="showGridX = $event" />
            X Lines
          </label>
          <label class="chk">
            <input type="checkbox" [ngModel]="showGridY" (ngModelChange)="showGridY = $event" />
            Y Lines
          </label>
        </div>
        }
      </div>
            <div class="zoom-controls">
        <button type="button" class="zoom-btn" (click)="fitCamera(); draw()" title="Fit to view (F)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 4H5a1 1 0 0 0-1 1v4" />
            <path d="M15 4h4a1 1 0 0 1 1 1v4" />
            <path d="M9 20H5a1 1 0 0 1-1-1v-4" />
            <path d="M15 20h4a1 1 0 0 0 1-1v-4" />
          </svg>
        </button>
        <button type="button" class="zoom-btn" (click)="applyZoom(pxPerMm / 1.1)" title="Zoom out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
        <span class="zoom-readout" title="Zoom (px/mm)">{{ pxPerMm.toFixed(1) }}</span>
        <button type="button" class="zoom-btn" (click)="applyZoom(pxPerMm * 1.1)" title="Zoom in">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
      </div>

    </div>
  </div>
