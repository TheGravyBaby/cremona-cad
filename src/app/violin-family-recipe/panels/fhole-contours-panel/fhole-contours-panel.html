@let k = params.fHoleContours!;

<section class="ui-group">
    <div class="ui-group-title">Upper</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">U1 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.U1R" (input)="edited()"
                [style.borderColor]="pal.ink(1).faint(3)" (focus)="highlight('U1', pal.ink(1).faint(3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">End Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" [(ngModel)]="k.U1End" (input)="edited()"
                (focus)="highlight('U1', pal.ink(1).faint(3))" (blur)="highlight(null)" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">U2 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.U2R" (input)="edited()"
                [style.borderColor]="pal.ink(1)" (focus)="highlight('U2', pal.ink(1))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <div class="toggle">
                <input type="checkbox" [(ngModel)]="k.U21DoubleArc" (change)="edited()" /><span>Compound</span>
            </div>
        </label>
    </div>
    @if (k.U21DoubleArc) {
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">U21 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.U21R" (input)="edited()"
                [style.borderColor]="pal.ink(1).faint(3)" (focus)="highlight('U21', pal.ink(1).faint(3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">Split Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" [(ngModel)]="k.U21Start" (input)="edited()"
                (focus)="highlight('U21', pal.ink(1).faint(3))" (blur)="highlight(null)" />
        </label>
    </div>
    }
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">U3 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.U3R" (input)="edited()"
                [style.borderColor]="pal.ink(1).faint(-3)" (focus)="highlight('U3', pal.ink(1).faint(-3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">U3 End Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" [(ngModel)]="k.U3End" (input)="edited()"
                (focus)="highlight('U3', pal.ink(1).faint(-3))" (blur)="highlight(null)" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Wing <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="0.25" min="0" [(ngModel)]="k.UCut.length" (input)="edited()"
                [style.borderColor]="pal.ink(3)" (focus)="highlight('UCut', pal.ink(3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">Slope <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" [(ngModel)]="k.UCut.slope" (input)="edited()"
                (focus)="highlight('UCut', pal.ink(3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">Eye Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" [(ngModel)]="k.UCut.angleOnEye" (input)="edited()"
                (focus)="highlight('UCut', pal.ink(3))" (blur)="highlight(null)" />
        </label>
    </div>
</section>

<section class="ui-group">
    <div class="ui-group-title">Stem</div>
    @if (k.stemArcsIndependent) {
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">S1 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.S1R" (input)="edited()"
                [style.borderColor]="pal.ink(2)" (focus)="highlight('S1', pal.ink(2))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">S2 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.S2R" (input)="edited()"
                [style.borderColor]="pal.ink(2)" (focus)="highlight('S2', pal.ink(2))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <div class="toggle">
                <input type="checkbox" [(ngModel)]="k.stemArcsIndependent" (change)="edited()" /><span>Unique radii</span>
            </div>
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">S3 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.S3R" (input)="edited()"
                [style.borderColor]="pal.ink(2)" (focus)="highlight('S3', pal.ink(2))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">S4 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.S4R" (input)="edited()"
                [style.borderColor]="pal.ink(2)" (focus)="highlight('S4', pal.ink(2))" (blur)="highlight(null)" />
        </label>
    </div>
    } @else {
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Arc Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.stemArcR" (input)="edited()"
                [style.borderColor]="pal.ink(2)" />
        </label>
        <label class="field-cell">
            <div class="toggle">
                <input type="checkbox" [(ngModel)]="k.stemArcsIndependent" (change)="edited()" /><span>Unique radii</span>
            </div>
        </label>
    </div>
    }
</section>

<section class="ui-group">
    <div class="ui-group-title">Lower</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">L1 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.L1R" (input)="edited()"
                [style.borderColor]="pal.ink(0).faint(3)" (focus)="highlight('L1', pal.ink(0).faint(3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">End Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" [(ngModel)]="k.L1End" (input)="edited()"
                (focus)="highlight('L1', pal.ink(0).faint(3))" (blur)="highlight(null)" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">L2 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.L2R" (input)="edited()"
                [style.borderColor]="pal.ink(0)" (focus)="highlight('L2', pal.ink(0))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <div class="toggle">
                <input type="checkbox" [(ngModel)]="k.L21DoubleArc" (change)="edited()" /><span>Compound</span>
            </div>
        </label>
    </div>
    @if (k.L21DoubleArc) {
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">L21 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.L21R" (input)="edited()"
                [style.borderColor]="pal.ink(0).faint(3)" (focus)="highlight('L21', pal.ink(0).faint(3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">Split Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" [(ngModel)]="k.L21Start" (input)="edited()"
                (focus)="highlight('L21', pal.ink(0).faint(3))" (blur)="highlight(null)" />
        </label>
    </div>
    }
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">L3 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.L3R" (input)="edited()"
                [style.borderColor]="pal.ink(0).faint(-3)" (focus)="highlight('L3', pal.ink(0).faint(-3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">L3 End Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" [(ngModel)]="k.L3End" (input)="edited()"
                (focus)="highlight('L3', pal.ink(0).faint(-3))" (blur)="highlight(null)" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Wing <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="0.25" min="0" [(ngModel)]="k.LCut.length" (input)="edited()"
                [style.borderColor]="pal.ink(3)" (focus)="highlight('LCut', pal.ink(3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">Slope <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" [(ngModel)]="k.LCut.slope" (input)="edited()"
                (focus)="highlight('LCut', pal.ink(3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">Eye Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" [(ngModel)]="k.LCut.angleOnEye" (input)="edited()"
                (focus)="highlight('LCut', pal.ink(3))" (blur)="highlight(null)" />
        </label>
    </div>
</section>
