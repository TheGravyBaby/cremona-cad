<section class="ui-group" [style.border-color]="colors.fHoleOuter">
    <div class="ui-group-title">Outer Arm</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">O1 Radius<span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.O1!.r, 1)" min="0"
                [ngModel]="round2(params.fHoles!.O1!.r)" (ngModelChange)="params.fHoles!.O1!.r = $event; onChange(); onArcFocus('O1', colors.fHoleOuterDark)"
                [style.borderColor]="colors.fHoleOuterDark" (focus)="onArcFocus('O1', colors.fHoleOuterDark)" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Extend Angle<span class="unit-label">°</span></span>
            <input type="number" class="basic-input" [step]="1" min="0"
                [ngModel]="getShoulderExtendDeg(params.fHoles!.O1!, 1)"
                (ngModelChange)="setShoulderExtendDeg(params.fHoles!.O1!, 1, $event); onArcFocus('O1', colors.fHoleOuterDark)"
                (focus)="onArcFocus('O1', colors.fHoleOuterDark)" (blur)="onArcBlur()" />
        </label>
        <button type="button" class="info-icon" (click)="fholeShoulderExtendInfo()" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">O2 Radius<span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.O2!.r, 1)" min="0"
                [ngModel]="round2(params.fHoles!.O2!.r)" (ngModelChange)="params.fHoles!.O2!.r = $event; onChange(); onArcFocus('O2', colors.fHoleOuter)"
                [style.borderColor]="colors.fHoleOuter" (focus)="onArcFocus('O2', colors.fHoleOuter)" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">O3 Radius<span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.O3!.r, 1)" min="0"
                [ngModel]="round2(params.fHoles!.O3!.r)" (ngModelChange)="params.fHoles!.O3!.r = $event; onChange(); onArcFocus('O3', colors.fHoleOuterMuted)"
                [style.borderColor]="colors.fHoleOuterMuted" (focus)="onArcFocus('O3', colors.fHoleOuterMuted)" (blur)="onArcBlur()" />
        </label>
    </div>
</section>

        <label class="field-cell">

        </label>
        <label class="field-cell">
            <span class="field-title">O5 End Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" [step]="stepFor(getArcEndDeg(params.fHoles!.O5!), 1)"

                (ngModelChange)="setArcEndDeg(params.fHoles!.O5!, $event, onChange.bind(this)); onArcFocus('O5', colors.fHoleOuterLight)"

        </label>
    </div>

    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Length <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.LCut!.length!, .25)"
                data-fine-step="0.25" min="0" [ngModel]="round2(params.fHoles!.LCut!.length)"
                (ngModelChange)="params.fHoles!.LCut!.length = $event; onChange(); onArcFocus('LCut', colors.fHoleStem)" [style.borderColor]="colors.fHoleStem"
                (focus)="onArcFocus('LCut', colors.fHoleStem)" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Cut At <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" [step]="stepFor(getCutDeg(params.fHoles!.LCut!, 'angleOnEye'), 1)"
                [ngModel]="getCutDeg(params.fHoles!.LCut!, 'angleOnEye')"
                (ngModelChange)="setCutDeg(params.fHoles!.LCut!, 'angleOnEye', $event); onArcFocus('LCut', colors.fHoleStem)"
                (focus)="onArcFocus('LCut', colors.fHoleStem)" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Slope <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" [step]="stepFor(getCutDeg(params.fHoles!.LCut!, 'slope'), 1)"
                [ngModel]="getCutDeg(params.fHoles!.LCut!, 'slope')"
                (ngModelChange)="setCutDeg(params.fHoles!.LCut!, 'slope', $event); onArcFocus('LCut', colors.fHoleStem)"
                (focus)="onArcFocus('LCut', colors.fHoleStem)" (blur)="onArcBlur()" />
        </label>

        <button type="button" class="info-icon" (click)="fholeCutInfo()" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
</section>
