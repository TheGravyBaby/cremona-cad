@if (params.scroll; as v) {
@if (params.stringSetup; as ss) {
@if (v.widths; as w) {

<section class="ui-group">
    <div class="ui-group-title">Pegbox</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pointColor('throat')">Throat <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pointColor('throat')"
                [(ngModel)]="w.throat" (input)="onChange()" (focus)="onPointFocus('throat')" (blur)="onPointBlur()" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">

        <label class="field-cell">
            <span class="field-title" [style.color]="pointColor('hip')">Hip <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pointColor('hip')"
                [(ngModel)]="w.hip" (input)="onChange()" (focus)="onPointFocus('hip')" (blur)="onPointBlur()" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="colors.scrollFrontLight">Wall <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="colors.scrollFrontLight"
                [(ngModel)]="v.pegbox.wall" (input)="onChange()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="colors.scrollFrontLight">Floor <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="colors.scrollFrontLight"
                [(ngModel)]="v.pegbox.floor" (input)="onChange()" />
        </label>
    </div>

    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pointColor('nut')">Nut <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pointColor('nut')"
                [(ngModel)]="ss.nutWidth" (input)="onChange()" (focus)="onPointFocus('nut')" (blur)="onPointBlur()" />
        </label>
    </div>
</section>

<section class="ui-group">
    <div class="ui-group-title">Volute</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pointColor('crown')">Crown <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pointColor('crown')"
                [(ngModel)]="w.crown" (input)="onChange()" (focus)="onPointFocus('crown')" (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="pointColor('turn1Bottom')">Turn 1 Bottom <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pointColor('turn1Bottom')"
                [(ngModel)]="w.turn1Bottom" (input)="onChange()" (focus)="onPointFocus('turn1Bottom')" (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="pointColor('turn2Top')">Turn 2 Top <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pointColor('turn2Top')"
                [(ngModel)]="w.turn2Top" (input)="onChange()" (focus)="onPointFocus('turn2Top')" (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="pointColor('turn2Bottom')">Turn 2 Bottom <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pointColor('turn2Bottom')"
                [(ngModel)]="w.turn2Bottom" (input)="onChange()" (focus)="onPointFocus('turn2Bottom')" (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="pointColor('eye')">Eye <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pointColor('eye')"
                [(ngModel)]="w.eye" (input)="onChange()" (focus)="onPointFocus('eye')" (blur)="onPointBlur()" />
        </label>
    </div>
</section>

}
}
}
