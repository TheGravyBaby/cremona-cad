@if (params.stringSetup) {

<section class="ui-group" [style.border-color]="colors.neck">
    <div class="ui-group-title">Neck</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Length <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" min="1" [style.border-color]="colors.neck"
                [(ngModel)]="params.neck!.length" (input)="onChange()"
                (focus)="onFieldFocus('length', colors.neck)" (blur)="onFieldBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" docTip="stringSetup.nutThickness">Nut Thickness <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="colors.nut"
                [(ngModel)]="stringSetup.nutThickness" (input)="onChange()"
                (focus)="onFieldFocus('nutThickness', colors.nut)" (blur)="onFieldBlur()" />
        </label>
    </div>
</section>

<section class="ui-group" [style.border-color]="colors.fingerboard">
    <div class="ui-group-title">Fingerboard</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Length <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" min="1" [style.border-color]="colors.fingerboard"
                [(ngModel)]="stringSetup.fingerboardLength" (input)="onChange()"
                (focus)="onFieldFocus('fbLength', colors.fingerboard)" (blur)="onFieldBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Thickness <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="colors.fingerboard"
                [(ngModel)]="stringSetup.fingerboardThickness" (input)="onChange()"
                (focus)="onFieldFocus('fbThickness', colors.fingerboard)" (blur)="onFieldBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Radius <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" min="1" [style.border-color]="colors.fingerboard"
                [(ngModel)]="stringSetup.fingerboardRadius" (input)="onChange()"
                (focus)="onFieldFocus('fbRadius', colors.fingerboard)" (blur)="onFieldBlur()" />
        </label>
    </div>
</section>

<section class="ui-group" [style.border-color]="colors.bridge">
    <div class="ui-group-title">Bridge</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Stop <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" min="1" [style.border-color]="colors.bridge"
                [(ngModel)]="stringSetup.bodyStop" (input)="onChange()"
                (focus)="onFieldFocus('bodyStop', colors.bridge)" (blur)="onFieldBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Height <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="colors.bridge"
                [(ngModel)]="stringSetup.bridgeHeight" (input)="onChange()"
                (focus)="onFieldFocus('bridgeHeight', colors.bridge)" (blur)="onFieldBlur()" />
        </label>
        @if (stringLength != null) {
        <label class="field-cell">
            <span class="field-title">String Length <span class="unit-label">mm</span></span>
            <div class="basic-display" aria-label="String length value">{{ stringLength | number:'1.1-1' }}</div>
        </label>
        }
    </div>
</section>

}
