@if (params.arching) {

<section class="ui-group">
    <div class="ui-group-title">Channel</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Land Edge <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0"
                [ngModel]="params.outerFlutingDepth" (ngModelChange)="setLandEdge($event)"
                [style.border-color]="colors.innerTrace"
                title="Where the flat land ends and the channel begins — shared by both plates, since it belongs to the outline and the purfling" />
        </label>
        <button type="button" class="info-icon" (click)="gougeCenterlineInfo()" title="More information">ⓘ</button>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <div class="toggle" title="Gouge the corners out to meet the channel, instead of leaving them flat">
                <input type="checkbox" [ngModel]="cornerGouge" (ngModelChange)="setCornerGouge($event)" />
                <span>Corners</span>
            </div>
        </label>
        <button type="button" class="info-icon" (click)="cornerGougeInfo()" title="More information">ⓘ</button>
    </div>
</section>

<section class="ui-group" [style.border-color]="colors.archTop">
    <div class="ui-group-title">Top Plate</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Sweep <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0.1"
                [ngModel]="gouge('top').sweepRadius" (ngModelChange)="setSweepRadius('top', $event)"
                [style.border-color]="colors.archTop"
                title="Sweep radius of the gouge" />
        </label>
        <label class="field-cell">
            <span class="field-title">Depth <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.1" min="0"
                [ngModel]="gouge('top').depth" (ngModelChange)="setDepth('top', $event)"
                [style.border-color]="colors.archTop"
                title="Depth at the trough — held below the sweep radius" />
        </label>
        <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <div class="basic-display" aria-label="Channel width value">{{ channelWidth('top') | number:'1.1-1' }}</div>
        </label>
        <button type="button" class="info-icon" (click)="gougeSectionInfo()" title="More information">ⓘ</button>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <div class="toggle" title="A second, narrower gouge for the waist">
                <input type="checkbox" [ngModel]="cBoutGouge('top')"
                    (ngModelChange)="setCBoutGouge('top', $event)" /><span>C Bout</span>
            </div>
        </label>
        @if (cBoutGouge('top')) {
        <label class="field-cell">
            <span class="field-title">Sweep <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0.1"
                [ngModel]="gouge('top').sweepRadius_cBout" (ngModelChange)="setSweepRadiusCBout('top', $event)"
                [style.border-color]="colors.archTop"
                title="Same land edge, same depth — only the inner edge moves" />
        </label>
        <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <div class="basic-display" aria-label="C-bout channel width value">{{ channelWidthCBout('top') |
                number:'1.1-1' }}</div>
        </label>
        }
        <button type="button" class="info-icon" (click)="gougeCBoutInfo()" title="More information">ⓘ</button>
    </div>
</section>

<section class="ui-group" [style.border-color]="colors.archBack">
    <div class="ui-group-title">Back Plate</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Sweep <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0.1"
                [ngModel]="gouge('bottom').sweepRadius" (ngModelChange)="setSweepRadius('bottom', $event)"
                [style.border-color]="colors.archBack"
                title="Sweep radius of the gouge" />
        </label>
        <label class="field-cell">
            <span class="field-title">Depth <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.1" min="0"
                [ngModel]="gouge('bottom').depth" (ngModelChange)="setDepth('bottom', $event)"
                [style.border-color]="colors.archBack"
                title="Depth at the trough — held below the sweep radius" />
        </label>
        <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <div class="basic-display" aria-label="Channel width value">{{ channelWidth('bottom') | number:'1.1-1' }}
            </div>
        </label>
        <button type="button" class="info-icon" (click)="gougeSectionInfo()" title="More information">ⓘ</button>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <div class="toggle" title="A second, narrower gouge for the waist">
                <input type="checkbox" [ngModel]="cBoutGouge('bottom')"
                    (ngModelChange)="setCBoutGouge('bottom', $event)" /><span>C Bout</span>
            </div>
        </label>
        @if (cBoutGouge('bottom')) {
        <label class="field-cell">
            <span class="field-title">Sweep <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0.1"
                [ngModel]="gouge('bottom').sweepRadius_cBout" (ngModelChange)="setSweepRadiusCBout('bottom', $event)"
                [style.border-color]="colors.archBack"
                title="Same land edge, same depth — only the inner edge moves" />
        </label>
        <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <div class="basic-display" aria-label="C-bout channel width value">{{ channelWidthCBout('bottom') |
                number:'1.1-1' }}</div>
        </label>
        }
        <button type="button" class="info-icon" (click)="gougeCBoutInfo()" title="More information">ⓘ</button>
    </div>
</section>

}
