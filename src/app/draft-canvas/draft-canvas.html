<div class="canvas-shell" [class.dark-mode]="isDarkMode">
  <!-- the docked tool bar and the drawing surface share a row; .ui-controls below spans both -->
  <div class="canvas-body">
    <app-tool-palette class="tool-dock"></app-tool-palette>

    <div #host class="host" [class.drawing]="activeTool !== null" tabindex="0" aria-label="Draft canvas" (wheel)="onScrollWheel($event)"
      (pointerdown)="onPointerDown($event)" (pointerup)="onPointerUp($event)"
      (pointerleave)="onPointerUp($event)" (dblclick)="onDoubleClick($event)" (contextmenu)="onContextMenu($event)">
      @if (contextMenu) {
        <!-- pointerdown is swallowed so the canvas neither closes the menu nor pans under it -->
        <app-edit-menu #contextMenuEl class="context-menu" [style.left.px]="contextMenu.x" [style.top.px]="contextMenu.y"
          [style.max-height.px]="contextMenu.maxHeight"
          (pointerdown)="$event.stopPropagation()" (done)="contextMenu = null" />
      }
      @if (editingTextShapeId) {
        <textarea #textEditArea class="text-edit-overlay"
          [rows]="editingTextRows"
          [cols]="editingTextCols"
          [style.left.px]="editingTextScreenX"
          [style.top.px]="editingTextScreenY"
          [style.color]="editingTextColor"
          [style.fontSize.px]="editingTextFontPx"
          [style.transform]="'translateY(-50%) rotate(' + editingTextRotation + 'deg)'"
          (input)="onTextEditInput($any($event.target).value)"
          (keydown)="onTextEditKeyDown($event)"
          (blur)="finishEditingText()"
          (pointerdown)="$event.stopPropagation()"
          (pointerup)="$event.stopPropagation()"
          spellcheck="false"></textarea>
      }
    </div>
  </div>

  <input #imageFileInput type="file" accept="image/*" style="display:none"
    (change)="onImageFileSelected($event)" />

  <div class="ui-controls">
    <div class="left">
      <!-- <button type="button" class="btn" (click)="darkMode()">Dark Mode</button> -->

      <app-settings-bar [activeTool]="activeTool"></app-settings-bar>
    </div>

    <div class="right">
      <!-- Debug, localhost only (see isLocalHost in helpers/debugDump.ts): everything drawn, to the clipboard. -->
      @if (debugDumpEnabled) {
      <button type="button" class="btn debug-dump-btn" (click)="copyCanvasDebugDump()" title="Copy drawn geometry">/</button>
      }
      <!-- What is on the canvas and whether you can see it, next to how it is drawn (axes/grid) and
           where you are looking (zoom). These lived in the tool palette until the bar got too wide
           to justify — see layer-controls.ts. -->
      <app-layer-controls (selectImageRequested)="selectShapeById($event)"
        (uploadImageRequested)="placeImageFromFile()"
        (linkImageRequested)="placeImageFromLink($event)"></app-layer-controls>

      <app-axis-controls [axisGrid]="axisGrid"></app-axis-controls>

      <div #zoomGroup class="zoom-group">
      <div class="zoom-controls">
        <button type="button" class="zoom-btn" (click)="fitCamera(); draw()" title="Fit to view (F)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 4H5a1 1 0 0 0-1 1v4" />
            <path d="M15 4h4a1 1 0 0 1 1 1v4" />
            <path d="M9 20H5a1 1 0 0 1-1-1v-4" />
            <path d="M15 20h4a1 1 0 0 0 1-1v-4" />
          </svg>
        </button>
        <button type="button" class="zoom-btn" (click)="applyZoom(pxPerMm / 1.1)" title="Zoom out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
        <button type="button" class="zoom-readout" [class.active]="viewOpen" (click)="viewOpen = !viewOpen"
          title="Zoom (px/mm). Click to set the view by number.">{{ pxPerMm.toFixed(1) }}</button>
        <button type="button" class="zoom-btn" (click)="applyZoom(pxPerMm * 1.1)" title="Zoom in">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
      </div>

      @if (viewOpen) {
      <div class="view-popup">
        <label class="view-row" title="Horizontal position of the view's centre, as the X axis numbers it.">
          <span>Centre X</span>
          <input #viewX type="number" step="1" [value]="viewField('x')" (change)="setViewField('x', viewX)" />
          <span class="view-unit">mm</span>
        </label>
        <label class="view-row" title="Vertical position of the view's centre, as the Y axis numbers it.">
          <span>Centre Y</span>
          <input #viewY type="number" step="1" [value]="viewField('y')" (change)="setViewField('y', viewY)" />
          <span class="view-unit">mm</span>
        </label>
        <label class="view-row" title="Screen pixels per millimetre of drawing, held about the centre.">
          <span>Zoom</span>
          <input #viewZoom type="number" step="0.1" min="0.05" [value]="viewField('zoom')"
            (change)="setViewField('zoom', viewZoom)" />
          <span class="view-unit">px/mm</span>
        </label>
      </div>
      }
      </div>

    </div>
  </div>
