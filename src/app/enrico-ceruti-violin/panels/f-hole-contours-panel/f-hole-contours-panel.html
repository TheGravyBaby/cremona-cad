<section class="ui-group" [style.border-color]="colors.fHoleUpper">
    <div class="ui-group-title">Upper Arm</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Shoulder R <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.upper.shoulder!.r, 1)" min="0"
                [(ngModel)]="params.fHoles!.upper.shoulder!.r" (input)="onChange(); onArcFocus('upper.shoulder')"
                [style.borderColor]="colors.fHoleUpper" (focus)="onArcFocus('upper.shoulder')" (blur)="onArcBlur()" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Arm R <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.upper.arm!.r, 1)" min="0"
                [(ngModel)]="params.fHoles!.upper.arm!.r" (input)="onChange(); onArcFocus('upper.arm')"
                [style.borderColor]="colors.fHoleUpper" (focus)="onArcFocus('upper.arm')" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Arm Sweep <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.upper.arm!.degreeDiff, 1)"
                [ngModel]="params.fHoles!.upper.arm!.degreeDiff"
                (ngModelChange)="adjustArcEnd(params.fHoles!.upper.arm!, $event, onChange.bind(this)); onArcFocus('upper.arm')"
                (focus)="onArcFocus('upper.arm')" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <div class="toggle">
                <input type="checkbox" [(ngModel)]="params.options.upperArmDoubleArc"
                    (change)="onCompoundChange('upper')" /><span>Compound</span>
            </div>
        </label>
        <button type="button" class="info-icon" (click)="fholeArmCompoundInfo()" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
    @if (params.options.upperArmDoubleArc && params.fHoles!.upper.arm2) {
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Arm 2 R <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.upper.arm2!.r, 1)" min="0"
                [(ngModel)]="params.fHoles!.upper.arm2!.r" (input)="onChange(); onArcFocus('upper.arm2')"
                [style.borderColor]="colors.fHoleUpper" (focus)="onArcFocus('upper.arm2')" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Arm 2 Sweep <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.upper.arm2!.degreeDiff, 1)"
                [ngModel]="params.fHoles!.upper.arm2!.degreeDiff"
                (ngModelChange)="adjustArcEnd(params.fHoles!.upper.arm2!, $event, onChange.bind(this)); onArcFocus('upper.arm2')"
                (focus)="onArcFocus('upper.arm2')" (blur)="onArcBlur()" />
        </label>
    </div>
    }
</section>

<section class="ui-group" [style.border-color]="colors.fHoleUpperOff">
    <div class="ui-group-title">Upper Wing</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Wing R <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.upper.wing!.r, 1)" min="0"

                [style.borderColor]="colors.fHoleUpperOff" (focus)="onArcFocus('upper.wing')" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Wing Start <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" [step]="stepFor(getArcStartDeg(params.fHoles!.upper.wing!), 1)"
                [ngModel]="getArcStartDeg(params.fHoles!.upper.wing!)"
                (ngModelChange)="setArcStartDeg(params.fHoles!.upper.wing!, $event, onChange.bind(this)); onArcFocus('upper.wing')"
                (focus)="onArcFocus('upper.wing')" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Wing End <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" [step]="stepFor(getArcEndDeg(params.fHoles!.upper.wing!), 1)"
                [ngModel]="getArcEndDeg(params.fHoles!.upper.wing!)"
                (ngModelChange)="setArcEndDeg(params.fHoles!.upper.wing!, $event, onChange.bind(this)); onArcFocus('upper.wing')"
                (focus)="onArcFocus('upper.wing')" (blur)="onArcBlur()" />
        </label>
    </div>

    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Cut Length <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.upper.cut!.length!, .25)"
                data-fine-step="0.25" min="0" [(ngModel)]="params.fHoles!.upper.cut!.length"
                (input)="onChange(); onArcFocus('upper.cut')" [style.borderColor]="colors.fHoleCutUpper"
                (focus)="onArcFocus('upper.cut')" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Cut At <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" [step]="stepFor(getCutDeg(params.fHoles!.upper.cut!, 'at'), 1)"
                [ngModel]="getCutDeg(params.fHoles!.upper.cut!, 'at')"
                (ngModelChange)="setCutDeg(params.fHoles!.upper.cut!, 'at', $event); onArcFocus('upper.cut')"
                (focus)="onArcFocus('upper.cut')" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Cut Slope <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" [step]="stepFor(getCutDeg(params.fHoles!.upper.cut!, 'slope'), 1)"
                [ngModel]="getCutDeg(params.fHoles!.upper.cut!, 'slope')"
                (ngModelChange)="setCutDeg(params.fHoles!.upper.cut!, 'slope', $event); onArcFocus('upper.cut')"
                (focus)="onArcFocus('upper.cut')" (blur)="onArcBlur()" />
        </label>

        <button type="button" class="info-icon" (click)="fholeCutInfo()" title="More information"
            aria-label="Information">ⓘ</button>
    </div>

</section>
<br>
