@if (params.scroll) {

<section class="ui-group" [style.border-color]="pal.neutral">
    <div class="ui-group-title">Volute</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell field-cell--full">
            <span class="field-title">Style</span>
            <select [style.border-color]="pal.neutral" [(ngModel)]="scroll.style" (ngModelChange)="onChange()">
                @for (s of styles; track s.id) {
                <option [value]="s.id">{{ s.label }}</option>
                }
            </select>
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Radius <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.25" data-step-shift="1" data-step-fine="0.1" min="0.25" [style.border-color]="pal.ink(3)"
                [(ngModel)]="scroll.eye.r" (input)="onChange()" />
        </label>
        <div class="field-cell field-cell--xy">
            <div class="xy-titles">
                <span class="field-title" docTip="volute.eyeX">X <span class="unit-label">mm</span></span>
                <span class="field-title" docTip="volute.eyeY">Y <span class="unit-label">mm</span></span>
            </div>
            <div class="xy-field" data-xy-point role="group" aria-label="Eye position"
                [style.borderColor]="pal.ink(3).faint(5)"
                title="Arrow keys move the eye from either box">
                <input type="number" class="basic-input" step="0.25" data-step-shift="1" data-step-fine="0.1" data-xy="x" aria-label="Eye X"
                    [disabled]="scroll.flushWithNeck" [ngModel]="round2(scroll.eye.x)" (ngModelChange)="scroll.eye.x = $event; onChange()" />
                <input type="number" class="basic-input" step="0.25" data-step-shift="1" data-step-fine="0.1" data-xy="y" aria-label="Eye Y"
                    [ngModel]="round2(scroll.eye.y)" (ngModelChange)="scroll.eye.y = $event; onChange()" />
            </div>
        </div>
    </div>
    <div class="input-group basic-row field-row" role="group">
        @if (archimedean) {
        <label class="field-cell">
            <span class="field-title" docTip="volute.pitch">Pitch <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.25" data-step-shift="1" data-step-fine="0.1" min="0.25" [style.border-color]="pal.neutral"
                [(ngModel)]="scroll.pitch" (input)="onChange()" />
        </label>
        }
        @if (kelly) {
        <label class="field-cell">
            <span class="field-title" docTip="volute.seed">Seed <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.25" data-step-shift="1" data-step-fine="0.1" min="0.25" [style.border-color]="pal.neutral"
                [(ngModel)]="scroll.seedLength" (input)="onChange()" />
        </label>
        }
        <label class="field-cell">
            <div class="toggle" docTip="volute.flushWithNeck">
                <input type="checkbox" [(ngModel)]="scroll.flushWithNeck" (ngModelChange)="onChange()" />
                <span>Fit to Neck</span>
            </div>
        </label>
    </div>
    @if (custom) {
    @for (arcs of arcRows; track $index) {
    <div class="input-group basic-row field-row" role="group">
        @for (i of arcs; track i) {
        <label class="field-cell field-cell--arc">
            <span class="field-title" [style.color]="i % 2 ? pal.ink(3).faint(1) : pal.ink(3).faint(-3)">R {{ arcEnd(i) }} <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.25" data-step-shift="1" data-step-fine="0.1" min="0.25" [style.border-color]="i % 2 ? pal.ink(3).faint(1) : pal.ink(3).faint(-3)"
                [ngModel]="scroll.arcRadii[i]" (ngModelChange)="setArcRadius(i, $event)"
                (focus)="onArcFocus(i, i % 2 ? pal.ink(3).faint(1) : pal.ink(3).faint(-3))" (blur)="onArcBlur()" />
        </label>
        }
    </div>
    }
    }
</section>

<section class="ui-group">
    <div class="ui-group-title">Crown</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(2).faint(3)" docTip="volute.s0">S0 R <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" data-step-shift="10" data-step-fine="0.1" min="0" [style.border-color]="pal.ink(2).faint(3)"
                [(ngModel)]="scroll.S0.r" (input)="onChange(); onArcFocus('S0', pal.ink(2).faint(3))"
                (focus)="onArcFocus('S0', pal.ink(2).faint(3))" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" docTip="volute.s0End">End <span class="unit-label">°</span></span>
            <input class="basic-input" type="number" step="1" data-step-shift="10" data-step-fine="0.1"
                [ngModel]="getFieldDeg(scroll.S0, 'end')" (ngModelChange)="setFieldDeg(scroll.S0, 'end', $event, onChange.bind(this)); onArcFocus('S0', pal.ink(2).faint(3))"
                (focus)="onArcFocus('S0', pal.ink(2).faint(3))" (blur)="onArcBlur()" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(2)" docTip="volute.s1">S1 R <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" data-step-shift="10" data-step-fine="0.1" min="0" [style.border-color]="pal.ink(2)"
                [(ngModel)]="scroll.S1.r" (input)="onChange(); onArcFocus('S1', pal.ink(2))"
                (focus)="onArcFocus('S1', pal.ink(2))" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" docTip="volute.s1End">End <span class="unit-label">°</span></span>
            <input class="basic-input" type="number" step="1" data-step-shift="10" data-step-fine="0.1"
                [ngModel]="getFieldDeg(scroll.S1, 'end')" (ngModelChange)="setFieldDeg(scroll.S1, 'end', $event, onChange.bind(this)); onArcFocus('S1', pal.ink(2))"
                (focus)="onArcFocus('S1', pal.ink(2))" (blur)="onArcBlur()" />
        </label>
    </div>
</section>

}
