@if (params.scroll) {

<section class="ui-group">
    <div class="ui-group-title">Back</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(1).faint(-3)" docTip="scroll.s2">S2 R <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" data-step-shift="10" data-step-fine="0.1" min="0" [style.border-color]="pal.ink(1).faint(-3)"
                [(ngModel)]="scroll.S2.r" (input)="onChange(); onArcFocus('S2', pal.ink(1).faint(-3))"
                (focus)="onArcFocus('S2', pal.ink(1).faint(-3))" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" docTip="scroll.s2End">End <span class="unit-label">°</span></span>
            <input class="basic-input" type="number" step="1" data-step-shift="10" data-step-fine="0.1"
                [ngModel]="getFieldDeg(scroll.S2, 'end')" (ngModelChange)="setFieldDeg(scroll.S2, 'end', $event, onChange.bind(this)); onArcFocus('S2', pal.ink(1).faint(-3))"
                (focus)="onArcFocus('S2', pal.ink(1).faint(-3))" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(1).faint(-3)" docTip="scroll.backStraight">Straight <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" data-step-shift="10" data-step-fine="0.1" min="0" [style.border-color]="pal.ink(1).faint(-3)"
                [(ngModel)]="scroll.backStraight" (input)="onChange(); onArcFocus('backStraight', pal.ink(1).faint(-3))"
                (focus)="onArcFocus('backStraight', pal.ink(1).faint(-3))" (blur)="onArcBlur()" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(1).faint(-1)" docTip="scroll.s3">S3 R <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" data-step-shift="10" data-step-fine="0.1" min="0" [style.border-color]="pal.ink(1).faint(-1)"
                [(ngModel)]="scroll.S3.r" (input)="onChange(); onArcFocus('S3', pal.ink(1).faint(-1))"
                (focus)="onArcFocus('S3', pal.ink(1).faint(-1))" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" docTip="scroll.hang">Hang <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" data-step-shift="10" data-step-fine="0.1"
                [(ngModel)]="scroll.hang" (input)="onChange(); onArcFocus('S3', pal.ink(1).faint(-1))"
                (focus)="onArcFocus('S3', pal.ink(1).faint(-1))" (blur)="onArcBlur()" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(1).faint(5)" docTip="scroll.nape">Nape R <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" data-step-shift="10" data-step-fine="0.1" min="0" [style.border-color]="pal.ink(1).faint(5)"
                [(ngModel)]="scroll.nape.r" (input)="onChange(); onArcFocus('nape', pal.ink(1).faint(5))"
                (focus)="onArcFocus('nape', pal.ink(1).faint(5))" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <div class="toggle" docTip="scroll.napeCircle">
                <input type="checkbox" [(ngModel)]="scroll.napeCircle" (ngModelChange)="onChange()" />
                <span>Circle</span>
            </div>
        </label>
    </div>
    @if (extent; as extent) {
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" docTip="scroll.height">Height <span class="unit-label">mm</span></span>
            <div class="basic-display" aria-label="Scroll height value">{{ extent.height | number:'1.1-1' }}</div>
        </label>
        <label class="field-cell">
            <span class="field-title" docTip="scroll.width">Width <span class="unit-label">mm</span></span>
            <div class="basic-display" aria-label="Scroll width value">{{ extent.width | number:'1.1-1' }}</div>
        </label>
        <label class="field-cell">
            <span class="field-title">H to W</span>
            <div class="basic-display" aria-label="Scroll height to width ratio value">{{ nearestFraction(extent.height / extent.width) }}</div>
        </label>
    </div>
    }
</section>

<section class="ui-group">
    <div class="ui-group-title">Front</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(4).faint(-3)" docTip="scroll.flat">Flat <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" data-step-shift="10" data-step-fine="0.1" min="0" [style.border-color]="pal.ink(4).faint(-3)"
                [(ngModel)]="scroll.flat" (input)="onChange(); onArcFocus('flat', pal.ink(4).faint(-3))"
                (focus)="onArcFocus('flat', pal.ink(4).faint(-3))" (blur)="onArcBlur()" />
        </label>
        @if (params.neck; as nk) {
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(0)" docTip="scroll.nutHeight">Nut Height <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pal.ink(0)"
                [(ngModel)]="nk.nutHeight" (input)="onChange()" />
        </label>
        }
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(4)" docTip="scroll.f0">F0 R <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" data-step-shift="10" data-step-fine="0.1" min="0" [style.border-color]="pal.ink(4)"
                [(ngModel)]="scroll.F0.r" (input)="onChange(); onArcFocus('F0', pal.ink(4))"
                (focus)="onArcFocus('F0', pal.ink(4))" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" docTip="scroll.f0End">End <span class="unit-label">°</span></span>
            <input class="basic-input" type="number" step="1" data-step-shift="10" data-step-fine="0.1"
                [ngModel]="getFieldDeg(scroll.F0, 'end')" (ngModelChange)="setFieldDeg(scroll.F0, 'end', $event, onChange.bind(this)); onArcFocus('F0', pal.ink(4))"
                (focus)="onArcFocus('F0', pal.ink(4))" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(4)" docTip="scroll.frontStraight">Straight <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" data-step-shift="10" data-step-fine="0.1" min="0" [style.border-color]="pal.ink(4)"
                [(ngModel)]="scroll.frontStraight" (input)="onChange(); onArcFocus('frontStraight', pal.ink(4))"
                (focus)="onArcFocus('frontStraight', pal.ink(4))" (blur)="onArcBlur()" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(4).faint(-3)" docTip="scroll.f1">F1 R <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="1" data-step-shift="10" data-step-fine="0.1" min="0" [style.border-color]="pal.ink(4).faint(-3)"
                [(ngModel)]="scroll.F1.r" (input)="onChange(); onArcFocus('F1', pal.ink(4).faint(-3))"
                (focus)="onArcFocus('F1', pal.ink(4).faint(-3))" (blur)="onArcBlur()" />
        </label>
    </div>
</section>

}
