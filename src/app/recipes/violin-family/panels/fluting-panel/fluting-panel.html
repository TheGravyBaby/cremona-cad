@let fluting = params.fluting!;

<section class="ui-group">
    <div class="ui-group-title">Channel</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Fluting Edge <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="0.1" min="0" [(ngModel)]="fluting.flutingEdge" (input)="recordEditAndRedraw()" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <div class="toggle">
            <input type="checkbox" [(ngModel)]="fluting.cornerGouge" (change)="recordEditAndRedraw()" /><span>Gouge Corners</span>
        </div>
        <button type="button" class="info-icon" (click)="showFieldHelp('cornerGouge')" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
</section>

<section class="ui-group">
    <div class="ui-group-title">Top Plate</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="0.5" min="0" [(ngModel)]="fluting.top.width" (input)="recordEditAndRedraw()"
                [style.borderColor]="pal.ink(3)" />
        </label>
        <label class="field-cell">
            <span class="field-title">Depth <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="0.1" min="0" [(ngModel)]="fluting.top.depth" (input)="recordEditAndRedraw()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Width to LB</span>
            <div class="basic-display" aria-label="Top plate channel width to body width">{{ widthRatio(fluting.top.width) }}</div>
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <div class="toggle">
                <input type="checkbox" [(ngModel)]="fluting.top.useCBoutGouge" (change)="recordEditAndRedraw()" /><span>C Bout</span>
            </div>
        </label>
        @if (fluting.top.useCBoutGouge) {
        <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="0.5" min="0" [(ngModel)]="fluting.top.cBoutWidth" (input)="recordEditAndRedraw()"
                [style.borderColor]="pal.ink(3)" />
        </label>
        }
        <button type="button" class="info-icon" (click)="showFieldHelp('gougeCBout')" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
</section>

<section class="ui-group">
    <div class="ui-group-title">Back Plate</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="0.5" min="0" [(ngModel)]="fluting.back.width" (input)="recordEditAndRedraw()"
                [style.borderColor]="pal.ink(0)" />
        </label>
        <label class="field-cell">
            <span class="field-title">Depth <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="0.1" min="0" [(ngModel)]="fluting.back.depth" (input)="recordEditAndRedraw()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Width to LB</span>
            <div class="basic-display" aria-label="Back plate channel width to body width">{{ widthRatio(fluting.back.width) }}</div>
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <div class="toggle">
                <input type="checkbox" [(ngModel)]="fluting.back.useCBoutGouge" (change)="recordEditAndRedraw()" /><span>C Bout</span>
            </div>
        </label>
        @if (fluting.back.useCBoutGouge) {
        <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="0.5" min="0" [(ngModel)]="fluting.back.cBoutWidth" (input)="recordEditAndRedraw()"
                [style.borderColor]="pal.ink(0)" />
        </label>
        }
        <button type="button" class="info-icon" (click)="showFieldHelp('gougeCBout')" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
</section>
