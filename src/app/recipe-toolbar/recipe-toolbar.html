<div class="toolbar">
  <div class="toolbar-name-wrap">
    <input type="text" class="toolbar-name" [ngModel]="fileName" (ngModelChange)="fileNameChange.emit($event)"
      placeholder="Untitled" [title]="fileName || 'Design name'" aria-label="Design name"
      (keydown.enter)="nameInput.blur()" #nameInput />

    <!-- Every file verb is a row of this one menu, so the strip stays the name and a chevron. -->
    <button type="button" class="toolbar-btn toolbar-menu-btn" title="File" aria-label="File menu"
      aria-haspopup="menu" [attr.aria-expanded]="menuOpen" (click)="menuOpen = !menuOpen">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 9 12 15 18 9" />
      </svg>
    </button>

    @if (menuOpen) {
    <div class="toolbar-menu" role="menu">
      <button type="button" class="toolbar-menu-item" role="menuitem" (click)="startBlank()">
        New blank instrument
      </button>
      @if (hasTemplates) {
      <button type="button" class="toolbar-menu-item" role="menuitem" (click)="menuOpen = false; openTemplates.emit()">
        Start from a historical instrument…
      </button>
      }
      <div class="toolbar-menu-sep" role="separator"></div>
      <button type="button" class="toolbar-menu-item" role="menuitem" (click)="menuOpen = false; triggerFilePick()">
        Upload Recipe
      </button>
      <button type="button" class="toolbar-menu-item" role="menuitem" (click)="menuOpen = false; saveFile.emit()">
        Download Recipe
      </button>
      <!-- Debug, localhost only (see isLocalHost in helpers/debugDump.ts): the saved recipe JSON, to the clipboard. -->
      @if (debugDumpEnabled) {
      <div class="toolbar-menu-sep" role="separator"></div>
      <button type="button" class="toolbar-menu-item debug-dump-item" role="menuitem"
        (click)="menuOpen = false; debugDump.emit()">
        Copy recipe JSON
      </button>
      }
    </div>
    }
  </div>

  @if (showExport) {
  <button type="button" class="toolbar-btn toolbar-btn--text" title="Templates, plans and a copy of the recipe"
    [class.active]="exportActive" [attr.aria-pressed]="exportActive"
    [disabled]="!exportEnabled" (click)="openExport.emit()">Export</button>
  }
  <input #fileInput class="toolbar-file-input" type="file" accept=".json,application/json" (change)="onFilePicked($event)" />
</div>
