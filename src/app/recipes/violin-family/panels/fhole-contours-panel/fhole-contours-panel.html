@let k = params.fHoleContours!;

<section class="ui-group">
    <div class="ui-group-title">Upper</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">U1 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.U1R" (input)="edited()"
                [style.borderColor]="pal.ink(1).faint(3)" (focus)="highlight('U1', pal.ink(1).faint(3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">U1 Sweep <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" min="0" max="180" [(ngModel)]="k.U1Sweep" (input)="edited()"
                (focus)="highlight('U1', pal.ink(1).faint(3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">to S</span>
            <div class="basic-display" aria-label="U1 to S ratio value">{{ ratio('U1toS') }}</div>
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">U2 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.U2R" (input)="edited()"
                [style.borderColor]="pal.ink(1)" (focus)="highlight('U2', pal.ink(1))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <div class="toggle">
                <input type="checkbox" [(ngModel)]="k.U21DoubleArc" (change)="edited()" /><span>Compound</span>
            </div>
        </label>
        <label class="field-cell">
            <span class="field-title">to S</span>
            <div class="basic-display" aria-label="U2 to S ratio value">{{ ratio('U2toS') }}</div>
        </label>
    </div>
    @if (k.U21DoubleArc) {
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">U21 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.U21R" (input)="edited()"
                [style.borderColor]="pal.ink(1).faint(3)" (focus)="highlight('U21', pal.ink(1).faint(3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">U2 Sweep <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" min="0" max="180" [(ngModel)]="k.U2Sweep" (input)="edited()"
                (focus)="highlight('U21', pal.ink(1).faint(3))" (blur)="highlight(null)" />
        </label>
    </div>
    }
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">U3 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.U3R" (input)="edited()"
                [style.borderColor]="pal.ink(1).faint(-3)" (focus)="highlight('U3', pal.ink(1).faint(-3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">Wing Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" [(ngModel)]="k.U3Angle" (input)="edited()"
                (focus)="highlight('U3', pal.ink(1).faint(-3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">to S</span>
            <div class="basic-display" aria-label="U3 to S ratio value">{{ ratio('U3toS') }}</div>
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Wing <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="0.25" min="0" [(ngModel)]="k.UCut.length" (input)="edited()"
                [style.borderColor]="pal.ink(3)" (focus)="highlight('UCut', pal.ink(3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">Slope <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" [(ngModel)]="k.UCut.slope" (input)="edited()"
                (focus)="highlight('UCut', pal.ink(3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">Eye Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" [(ngModel)]="k.UCut.angleOnEye" (input)="edited()"
                (focus)="highlight('UCut', pal.ink(3))" (blur)="highlight(null)" />
        </label>
    </div>
</section>

<section class="ui-group">
    <div class="ui-group-title">Stem</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Arc Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.stemArcR" (input)="edited()"
                [style.borderColor]="pal.ink(2)" />
        </label>
        <label class="field-cell"></label>
        <label class="field-cell">
            <span class="field-title">to Eye Span</span>
            <div class="basic-display" aria-label="S to EyeSpan ratio value">{{ ratio('StoEyeSpan') }}</div>
        </label>
    </div>
</section>

    <div class="ui-group-title">Lower</div>
    <div class="input-group basic-row field-row" role="group">

        <label class="field-cell">

    <div class="input-group basic-row field-row" role="group">

        <label class="field-cell">

        </label>
    </div>
    @if (k.L21DoubleArc) {
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">L21 Radius <span class="unit-label">mm</span></span>

        <label class="field-cell">

        </label>
    </div>
    }
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">L3 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.L3R" (input)="edited()"
                [style.borderColor]="pal.ink(0).faint(-3)" (focus)="highlight('L3', pal.ink(0).faint(-3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">Wing Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" [(ngModel)]="k.L3Angle" (input)="edited()"
                (focus)="highlight('L3', pal.ink(0).faint(-3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">to S</span>
            <div class="basic-display" aria-label="L3 to S ratio value">{{ ratio('L3toS') }}</div>
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Wing <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="0.25" min="0" [(ngModel)]="k.LCut.length" (input)="edited()"
                [style.borderColor]="pal.ink(3)" (focus)="highlight('LCut', pal.ink(3))" (blur)="highlight(null)" />
        </label>
        <label class="field-cell">
            <span class="field-title">Slope <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" [(ngModel)]="k.LCut.slope" (input)="edited()"

        <label class="field-cell">
