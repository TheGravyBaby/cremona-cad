@let bouts = params.bouts!;

<section class="ui-group">
    <div class="ui-group-title">Upper Bout</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Total Width <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="1" [(ngModel)]="bouts.UBW" (input)="edited()" />
        </label>
        <button type="button" class="info-icon" (click)="help('boutWidth')" title="More information"
            aria-label="Information">ⓘ</button>
        <!-- empty cell for spacing -->
        <label class="field-cell"></label>
        <label class="field-cell">
            <span class="field-title">UB to LB</span>
            <div class="basic-display" aria-label="Upper bout to lower bout ratio value">{{ ratio('UBtoLB') }}</div>
        </label>
    </div>

    <div class="ui-group">
        <div class="input-group basic-row field-row" role="group">
            <label class='field-cell'>
                <span class="field-title">U0 - Join Radius <span class="unit-label">mm</span></span>
                <input type="number" class="basic-input" step="1" min="1" [(ngModel)]="bouts.U0R" (input)="edited()"
                    [style.borderColor]="pal.ink(1)"
                    (focus)="highlight('U0', pal.ink(1))" (blur)="highlight(null)" />
            </label>
            <label class="field-cell"></label>
            <label class='field-cell'>
                <span class="field-title">U0 to UBW</span>
                <div class="basic-display" aria-label="U0 to upper bout width ratio value">{{ ratio('U0toUBW') }}</div>
            </label>
        </div>
        <div class="input-group basic-row field-row" role="group">
            <label class='field-cell'>
                <span class="field-title">U1 - Vesecai Radius <span class="unit-label">mm</span></span>
                <input type="number" class="basic-input" step="1" min="1" [(ngModel)]="bouts.U1R" (input)="edited()"
                    [style.borderColor]="pal.ink(1).faint(-2)"
                    (focus)="highlight('U1', pal.ink(1).faint(-2))" (blur)="highlight(null)" />
            </label>
            <label class="field-cell"></label>
            <label class='field-cell'>
                <span class="field-title">U1 to UBW</span>
                <div class="basic-display" aria-label="U1 to upper bout width ratio value">{{ ratio('U1toUBW') }}</div>
            </label>
        </div>
    </div>
</section>

<section class="ui-group">
    <div class="ui-group-title">Lower Bout</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Total Width <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="1" [(ngModel)]="params.body.width" (input)="edited()" />
        </label>
        <button type="button" class="info-icon" (click)="help('boutWidth')" title="More information"
            aria-label="Information">ⓘ</button>
        <!-- empty cell for spacing -->
        <label class="field-cell"></label>
        <label class="field-cell">
            <span class="field-title">LB to H</span>
            <div class="basic-display" aria-label="Lower bout to height ratio value">{{ ratio('LBtoH') }}</div>
        </label>
    </div>

    <div class="ui-group">
        <div class="input-group basic-row field-row" role="group">
            <label class='field-cell'>
                <span class="field-title">L0 - Join Radius <span class="unit-label">mm</span></span>
                <input type="number" class="basic-input" step="1" min="1" [(ngModel)]="bouts.L0R" (input)="edited()"
                    [style.borderColor]="pal.ink(0)"
                    (focus)="highlight('L0', pal.ink(0))" (blur)="highlight(null)" />
            </label>
            <label class="field-cell"></label>
            <label class='field-cell'>
                <span class="field-title">L0 to LBW</span>
                <div class="basic-display" aria-label="L0 to lower bout width ratio value">{{ ratio('L0toLBW') }}</div>
            </label>
        </div>
        <div class="input-group basic-row field-row" role="group">
            <label class='field-cell'>
                <span class="field-title">L1 - Vesecai Radius <span class="unit-label">mm</span></span>
                <input type="number" class="basic-input" step="1" min="1" [(ngModel)]="bouts.L1R" (input)="edited()"
                    [style.borderColor]="pal.ink(0).faint(-2)"
                    (focus)="highlight('L1', pal.ink(0).faint(-2))" (blur)="highlight(null)" />
            </label>
            <label class="field-cell"></label>
            <label class='field-cell'>
                <span class="field-title">L1 to LBW</span>
                <div class="basic-display" aria-label="L1 to lower bout width ratio value">{{ ratio('L1toLBW') }}</div>
            </label>
        </div>
    </div>
</section>

<section class="ui-group">
    <div class="ui-group-title">Viol Neck</div>
    <div class="input-group basic-row field-row" role="group">
        <div class="toggle">
            <input type="checkbox" [(ngModel)]="bouts.useViolNeck" (change)="edited()" /><span>Use Viol Neck </span>
        </div>
        <button type="button" class="info-icon" (click)="help('violNeck')" title="More information"
            aria-label="Information">ⓘ</button>
    </div>

    @if (bouts.useViolNeck && bouts.viol; as viol) {
    <div class="ui-group">
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">V0 Radius <span class="unit-label">mm</span></span>
                <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="viol.V0R" (input)="edited()" [style.borderColor]="pal.ink(1)"
                    (focus)="highlight('V0', pal.ink(1))" (blur)="highlight(null)" />
            </label>
            <label class="field-cell">
                <span class="field-title">V0 Start <span class="unit-label">°</span></span>
                <input type="number" class="basic-input" step="1" [(ngModel)]="viol.V0Start" (input)="edited()"
                    (focus)="highlight('V0', pal.ink(1))" (blur)="highlight(null)" />
            </label>
            <label class="field-cell">
                <span class="field-title">V0 End <span class="unit-label">°</span></span>
                <input type="number" class="basic-input" step="1" [(ngModel)]="viol.V0End" (input)="edited()"
                    (focus)="highlight('V0', pal.ink(1))" (blur)="highlight(null)" />
            </label>
        </div>
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">Width <span class="unit-label">mm</span></span>
                <input type="number" class="basic-input" step="1" [(ngModel)]="viol.width" (input)="edited()" />
            </label>
            <label class="field-cell">
                <span class="field-title">Join Radius <span class="unit-label">mm</span></span>
                <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="viol.neckRadius" (input)="edited()" />
            </label>
            <button type="button" class="info-icon" (click)="help('violNeckJoin')" title="More information"
                aria-label="Information">ⓘ</button>
        </div>
    </div>
    }
</section>
