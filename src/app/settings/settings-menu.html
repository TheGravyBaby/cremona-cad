<div class="settings-popup" role="dialog" aria-label="Settings">
  <div class="setting-row">
    <span class="setting-label">Appearance</span>
    <div class="theme-seg" role="radiogroup" aria-label="Appearance">
      @for (o of appearances; track o.id) {
      <button type="button" role="radio" class="theme-opt" [class.active]="settings.appearance() === o.id"
        [attr.aria-checked]="settings.appearance() === o.id" [attr.title]="o.hint" (click)="settings.set('appearance', o.id)">
        @switch (o.id) {
        @case ('day') {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" />
        </svg>
        }
        @case ('night') {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
        </svg>
        }
        @default {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.5" />
          <path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" />
        </svg>
        }
        }
        <span>{{ o.label }}</span>
      </button>
      }
    </div>
  </div>

  <div class="setting-row" docTip="prefs.fitOnPanelChange">
    <span class="setting-label">Fit view on panel change</span>
    <button type="button" role="switch" class="switch" [class.on]="settings.fitOnPanelChange()"
      [attr.aria-checked]="settings.fitOnPanelChange()" aria-label="Fit view on panel change"
      (click)="settings.set('fitOnPanelChange', !settings.fitOnPanelChange())"></button>
  </div>

   <div class="setting-row" docTip="prefs.barAutoHide">
    <span class="setting-label">Auto-hide top bar</span>
    <button type="button" role="switch" class="switch" [class.on]="settings.barAutoHide()"
      [attr.aria-checked]="settings.barAutoHide()" aria-label="Auto-hide top bar"
      (click)="settings.set('barAutoHide', !settings.barAutoHide())"></button>
  </div>
</div>
