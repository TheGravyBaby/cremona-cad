@if (params.scroll; as v) {
@if (params.stringSetup; as ss) {
@if (v.widths; as w) {

<section class="ui-group">
    <div class="ui-group-title">Pegbox</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pointColor('nut')" title="The nut's width across the neck. The pegbox is as wide where it meets it, and tapers from the end of its straight to the throat">Nut <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pointColor('nut')"
                [(ngModel)]="ss.nutWidth" (input)="onChange()" (focus)="onPointFocus('nut')" (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="pointColor('straight')" title="How far above the nut's top the pegbox stays as wide as the nut before its taper starts. Long enough to clear the duck tail's round, the back joins the neck without a shoulder">Straight <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pointColor('straight')"
                [(ngModel)]="v.pegbox.straight" (input)="onChange()" (focus)="onPointFocus('straight')" (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="pointColor('throat')" title="The pegbox's width at the throat, where its front runs in under the volute. The taper from the nut ends here">Throat <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pointColor('throat')"
                [(ngModel)]="w.throat" (input)="onChange()" (focus)="onPointFocus('throat')" (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="colors.scrollFrontLight" title="Each cheek's thickness at the pegbox's front edge. The hollow's mouth is drawn this far in from the outside">Wall <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="colors.scrollFrontLight"
                [(ngModel)]="v.pegbox.wall" (input)="onChange()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="colors.scrollFrontLight" title="The wood left between the hollow and the pegbox's back. The floor follows the back this far inside it">Floor <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="colors.scrollFrontLight"
                [(ngModel)]="v.pegbox.floor" (input)="onChange()" />
        </label>
    </div>
</section>

<section class="ui-group">
    <div class="ui-group-title">Volute</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pointColor('crown')" title="The head's width over the top of the crown, its narrowest">Crown <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pointColor('crown')"
                [(ngModel)]="w.crown" (input)="onChange()" (focus)="onPointFocus('crown')" (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="pointColor('turn1Bottom')" title="The first turn's width at its lowest, under the volute">Turn 1 Bottom <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pointColor('turn1Bottom')"
                [(ngModel)]="w.turn1Bottom" (input)="onChange()" (focus)="onPointFocus('turn1Bottom')" (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="pointColor('turn2Top')" title="The second turn's width at its highest">Turn 2 Top <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pointColor('turn2Top')"
                [(ngModel)]="w.turn2Top" (input)="onChange()" (focus)="onPointFocus('turn2Top')" (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="pointColor('turn2Bottom')" title="The second turn's width at its lowest">Turn 2 Bottom <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pointColor('turn2Bottom')"
                [(ngModel)]="w.turn2Bottom" (input)="onChange()" (focus)="onPointFocus('turn2Bottom')" (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="pointColor('eye')" title="The width across the eyes, which stand out as a cylinder. The last turn is as wide from its top on in">Eye <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pointColor('eye')"
                [(ngModel)]="w.eye" (input)="onChange()" (focus)="onPointFocus('eye')" (blur)="onPointBlur()" />
        </label>
    </div>
</section>

}
}
}
