@if (params.scroll; as v) {
@if (params.neck; as nk) {
@if (v.widths; as w) {

<section class="ui-group">
    <div class="ui-group-title">Front</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(3).faint(1)"
                docTip="scrollWidths.throat">Throat
                <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pal.ink(3).faint(1)"
                [(ngModel)]="w.throat" (input)="onChange()" (focus)="onPointFocus('throat', pal.ink(3).faint(1))" (blur)="onPointBlur()" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(3).faint(-3)"
                docTip="scrollWidths.hip">Hip
                <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pal.ink(3).faint(-3)" min="0"
                [disabled]="v.hipHeight === 0" [(ngModel)]="w.hip" (input)="onChange()" (focus)="onPointFocus('hip', pal.ink(3).faint(-3))"
                (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title"
                docTip="scrollWidths.hipY">Hip
                Y <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" [(ngModel)]="v.hipHeight" (input)="onChange()" min="0"
                (focus)="onPointFocus('hip', pal.ink(3).faint(-3))" (blur)="onPointBlur()" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(3).faint(-1)"
                docTip="scrollWidths.nutWidth">Nut <span
                    class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pal.ink(0)"
                [(ngModel)]="nk.nutWidth" (input)="onChange()" (focus)="onPointFocus('nut', pal.ink(3).faint(-1))" (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(3).faint(-3)"
                docTip="scrollWidths.wall">Wall
                <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pal.ink(3).faint(-3)"
                [(ngModel)]="v.pegbox.wall" (input)="onChange()" />
        </label>
    </div>


</section>

<section class="ui-group">
    <div class="ui-group-title">Back</div>

    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(1).faint(5)"
                docTip="scrollWidths.crown">Crown <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pal.ink(1).faint(5)"
                [(ngModel)]="w.crown" (input)="onChange()" (focus)="onPointFocus('crown', pal.ink(1).faint(5))" (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(1).faint(-3)"
                docTip="scrollWidths.poll">Poll
                <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pal.ink(1).faint(-3)"
                [(ngModel)]="w.poll" (input)="onChange()" (focus)="onPointFocus('poll', pal.ink(1).faint(-3))" (blur)="onPointBlur()" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(1).faint(1)"
                docTip="scrollWidths.backHip">Hip
                <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pal.ink(1).faint(1)"
                [disabled]="!(v.backHipHeight > 0)" [(ngModel)]="w.backHip" (input)="onChange()"
                (focus)="onPointFocus('backHip', pal.ink(1).faint(1))" (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title"
                docTip="scrollWidths.backHipY">Hip
                Y <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" [(ngModel)]="v.backHipHeight" (input)="onChange()"
                min="0" (focus)="onPointFocus('backHip', pal.ink(1).faint(1))" (blur)="onPointBlur()" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(1).faint(-4)"
                docTip="scrollWidths.foot">Foot
                <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pal.ink(1).faint(-4)"
                [(ngModel)]="w.foot" (input)="onChange()" (focus)="onPointFocus('foot', pal.ink(1).faint(-4))" (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(1).faint(3)"
                docTip="scrollWidths.duckTail">Duck
                Tail <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pal.ink(1).faint(3)"
                [(ngModel)]="w.duckTail" (input)="onChange()" (focus)="onPointFocus('duckTail', pal.ink(1).faint(3))"
                (blur)="onPointBlur()" />
        </label>
    </div>
    <!-- interesting controls for the compass step, not needed for now. -->
    <!-- <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title"
                docTip="scrollWidths.compassSteps">Compass
                Steps</span>
            <input class="basic-input" type="number" step="1" min="1" [(ngModel)]="v.compassSteps" (input)="onChange()" />
        </label>
        <label class="field-cell">
            <span class="field-title" docTip="scrollWidths.compassStep">Step <span class="unit-label">mm</span></span>
            <div class="basic-display" aria-label="Compass step value">{{ compass ? compass.step.toFixed(1) : '' }}</div>
        </label>
    </div>
    @if (compass) {
    <div class="hint">{{ compass.volute.toFixed(0) }} mm up the back from the poll to the second turn's bottom{{ compass.step - compass.last > 0.05 ? ', the last step ' + compass.last.toFixed(1) + ' mm: too few to follow the turns' : '' }}</div>
    } -->
</section>

<section class="ui-group">
    <div class="ui-group-title">Turns</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(2).faint(3)">Turn 1 Bottom <span
                    class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pal.ink(2).faint(3)"
                [(ngModel)]="w.turn1Bottom" (input)="onChange()" (focus)="onPointFocus('turn1Bottom', pal.ink(2).faint(3))"
                (blur)="onPointBlur()" />
        </label>
    </div>

    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(2).faint(-3)">Turn 2 Top <span
                    class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pal.ink(2).faint(-3)"
                [(ngModel)]="w.turn2Top" (input)="onChange()" (focus)="onPointFocus('turn2Top', pal.ink(2).faint(-3))"
                (blur)="onPointBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title" [style.color]="pal.ink(2).faint(1)">Turn 2 Bottom <span
                    class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pal.ink(2).faint(1)"
                [(ngModel)]="w.turn2Bottom" (input)="onChange()" (focus)="onPointFocus('turn2Bottom', pal.ink(2).faint(1))"
                (blur)="onPointBlur()" />
        </label>
    </div>

    <label class="field-cell">
        <span class="field-title" [style.color]="pal.ink(2).faint(-4)"
            docTip="scrollWidths.lastTurn">Eye <span class="unit-label">mm</span></span>
        <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="pal.ink(2).faint(-4)"
            [(ngModel)]="w.eye" (input)="onChange()" (focus)="onPointFocus('eye', pal.ink(2).faint(-4))" (blur)="onPointBlur()" />
    </label>
</section>



}
}
}
