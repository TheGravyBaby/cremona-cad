<section class="ui-group" [style.border-color]="colors.fHoleUpper">
    <div class="ui-group-title">Upper Eye</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [ngModel]="round2(params.fHoles!.UEye!.r)"
                (ngModelChange)="params.fHoles!.UEye!.r = $event; onChange()" [style.borderColor]="colors.fHoleUpper" />
        </label>
        <label class="field-cell"></label>
        <label class='field-cell'>
            <span class="field-title">Ur to Lr</span>
            <div class="basic-display" aria-label="Upper bout to upper bout width ratio value">{{
                nearestFraction(params.ratios.FUtoL) }}</div>
        </label>
    </div>

    <div class="input-group basic-row field-row" role="group">
        <div class="field-cell field-cell--xy">
            <div class="xy-titles">
                <span class="field-title">X <span class="unit-label">mm</span></span>
                <span class="field-title">Y <span class="unit-label">mm</span></span>
            </div>
            <div class="xy-field" data-xy-point role="group" aria-label="Upper eye position"
                [style.borderColor]="colors.fHoleUpper"
                title="Arrow keys move the eye from either box">
                <input type="number" class="basic-input" step="1" min="0" data-xy="x" aria-label="Upper eye X"
                    [ngModel]="round2(params.fHoles!.UEye!.x)" (ngModelChange)="params.fHoles!.UEye!.x = $event; onChange()" />
                <input type="number" class="basic-input" step="1" min="0" data-xy="y" aria-label="Upper eye Y"
                    [ngModel]="round2(params.fHoles!.UEye!.y)" (ngModelChange)="params.fHoles!.UEye!.y = $event; onChange()" />
            </div>
        </div>
        <label class='field-cell'>
            <span class="field-title">Eye Distance</span>
            <div class="basic-display" aria-label="Upper bout to upper bout width ratio value">{{
                distanceBetweenEyes() }}</div>
        </label>
    </div>

    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Rise <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [ngModel]="round2(params.fHoles!.URise)"
                (ngModelChange)="params.fHoles!.URise = $event; onChange()" />
        </label>
        
        <label class='field-cell'>
            <span class="field-title">H to W</span>
            <div class="basic-display" aria-label="F-hole bounding box height to width ratio value">{{
                boundsHeightToWidth() }}
            </div>
        </label>

    </div>

</section>

<section class="ui-group" [style.border-color]="colors.fHoleStem">
    <div class="ui-group-title">Stem</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="0" [ngModel]="round2(params.fHoles!.stem.width)"
                (ngModelChange)="params.fHoles!.stem.width = $event; onChange()"
                [style.borderColor]="colors.fHoleStem" />
        </label>
         <label class="field-cell">
            <span class="field-title">Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" [min]="stemAngleRange[0]" [max]="stemAngleRange[1]"
                [ngModel]="getStemAngleDeg(params.fHoles!.stem)"
                (ngModelChange)="setStemAngleDeg(params.fHoles!.stem, $event)" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <div class="field-cell field-cell--xy">
            <div class="xy-titles">
                <span class="field-title">X <span class="unit-label">mm</span></span>
                <span class="field-title">Y <span class="unit-label">mm</span></span>
            </div>
            <div class="xy-field" data-xy-point role="group" aria-label="Stem centre position"
                [style.borderColor]="colors.fHoleStem"
                title="Arrow keys move the stem from either box">
                <input type="number" class="basic-input" step="1" min="0" data-xy="x" aria-label="Stem centre X"
                    [ngModel]="round2(params.fHoles!.stem.center!.x)" (ngModelChange)="params.fHoles!.stem.center!.x = $event; onChange()" />
                <input type="number" class="basic-input" step="1" min="0" data-xy="y" aria-label="Stem centre Y"
                    [ngModel]="round2(params.fHoles!.stem.center!.y)" (ngModelChange)="params.fHoles!.stem.center!.y = $event; onChange()" />
            </div>
        </div>
    </div>
</section>
