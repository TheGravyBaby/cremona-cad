<section class="ui-group" [style.border-color]="colors.upperEye">
    <div class="ui-group-title">Upper Eye</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]=".1" min="0" [(ngModel)]="params.fHoles!.FU0.r"
                (input)="onChange()" [style.borderColor]="colors.upperEye" />
        </label>
        <label class="field-cell"></label>
        <label class='field-cell'>
            <span class="field-title">U to L</span>
            <div class="basic-display" aria-label="Upper bout to upper bout width ratio value">{{
                nearestFraction(params.ratios.FUtoL) }}</div>
        </label>
    </div>

    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">X <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]=".1" min="0" [(ngModel)]="params.fHoles!.FU0.x"
                (input)="onChange()" [style.borderColor]="colors.upperEyeOff" />
        </label>
        <label class="field-cell">
            <span class="field-title">Y <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]=".1" min="0" [(ngModel)]="params.fHoles!.FU0.y"
                (input)="onChange()" [style.borderColor]="colors.upperEyeOff" />
        </label>
    </div>

    <div class="input-group basic-row field-row" role="group">
         <label class="field-cell">
            <span class="field-title">Arc Height <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]=".1" min="0" [(ngModel)]="params.fHoles!.UH"
                (input)="onChange()" />
        </label>

    </div>

</section>

<section class="ui-group" [style.border-color]="colors.lowerEye">
    <div class="ui-group-title">Stem</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">X <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]=".1" min="0" [(ngModel)]="params.fHoles!.stemCenter.x"
                (input)="onChange()"/>
        </label>
        <label class="field-cell">
            <span class="field-title">Y <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]=".1" min="0" [(ngModel)]="params.fHoles!.stemCenter.y"
                (input)="onChange()" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
          <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]=".1" min="0" [(ngModel)]="params.fHoles!.stemWidth"
                (input)="onChange()"/>
        </label>
        <label class="field-cell">
            <span class="field-title">Slope <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]=".01" min="0" [(ngModel)]="params.fHoles!.stemSlope"
                (input)="onChange()" />
        </label>
    </div>
</section>


<section class="ui-group" [style.border-color]="colors.lowerEye">
    <div class="ui-group-title">Lower Eye</div>
    <div class="input-group basic-row field-row" role="group">

        <label class="field-cell">
            <span class="field-title">Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]=".1" min="0" [(ngModel)]="params.fHoles!.FL0.r"
                (input)="onChange()" [style.borderColor]="colors.lowerEye" />
        </label>
        <label class="field-cell"></label>
        <label class='field-cell'>
            <span class="field-title">FU to W</span>
            <div class="basic-display" aria-label="Upper bout to upper bout width ratio value">{{
                nearestSmallFraction(params.ratios.FLtoW) }}</div>
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">X <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]=".1" min="0" [(ngModel)]="params.fHoles!.FL0.x"
                (input)="onChange()" [style.borderColor]="colors.lowerEyeOff" />
        </label>
        <label class="field-cell">
            <span class="field-title">Y <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]=".1" min="0" [(ngModel)]="params.fHoles!.FL0.y"
                (input)="onChange()" [style.borderColor]="colors.lowerEyeOff" />
        </label>
    </div>


    <div class="input-group basic-row field-row" role="group">
         <label class="field-cell">
            <span class="field-title">Arc Height <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]=".1" min="0" [(ngModel)]="params.fHoles!.LH"
                (input)="onChange()" />
        </label>
    </div>
</section>
