@let bouts = params.bouts!;
@let k = params.corners!;

<section class="ui-group">
    <div class="ui-group-title">Upper Corner</div>
    <div class="input-group basic-row field-row" role="group">
        <div class="field-cell field-cell--xy">
            <div class="xy-titles">
                <span class="field-title">X</span>
                <span class="field-title">Y</span>
            </div>
            <div class="xy-field" data-xy-point role="group" aria-label="Upper corner position"
                [style.borderColor]="pal.ink(4).faint(5)" title="Arrow keys move the corner from either box">
                <input type="number" class="basic-input" step="1" data-xy="x" aria-label="Upper corner X"
                    [(ngModel)]="k.UCr.x" (input)="recordEditAndRedraw()"
                    (focus)="highlightPart('UCr', pal.ink(4).faint(5))" (blur)="clearHighlight()" />
                <input type="number" class="basic-input" step="1" data-xy="y" aria-label="Upper corner Y"
                    [(ngModel)]="k.UCr.y" (input)="recordEditAndRedraw()"
                    (focus)="highlightPart('UCr', pal.ink(4).faint(5))" (blur)="clearHighlight()" />
            </div>
        </div>
        <div class="field-cell">
            <button type="button" class="recipe-btn" (click)="defaultCorner('upper')"
                title="Set the upper corner to a default position">Default</button>
        </div>
        <button type="button" class="info-icon" (click)="showFieldHelp('cornerPosition')" title="More information"
            aria-label="Information">ⓘ</button>
    </div>

    <div class="ui-group">
        <div class="input-group basic-row field-row" role="group"
            [style.opacity]="k.useViolCornerUC ? 0.5 : 1" [style.pointerEvents]="k.useViolCornerUC ? 'none' : 'auto'">
            <label class="field-cell">
                <span class="field-title">U3 Corner Radius</span>
                <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.U3R" (input)="recordEditAndRedraw()"
                    [style.borderColor]="pal.ink(4)"
                    (focus)="highlightPart('U3', pal.ink(4))" (blur)="clearHighlight()" />
            </label>
            <label class="field-cell">
                <div class="toggle">
                    <input type="checkbox" [(ngModel)]="k.U31DoubleArc" (change)="recordEditAndRedraw()" /><span>Compound</span>
                </div>
            </label>
            <label class="field-cell">
                <span class="field-title">U3 to LBW</span>
                <div class="basic-display" aria-label="U3 to lower bout width ratio value">{{ formatRatio('U3toLBW') }}</div>
            </label>
        </div>
        @if (k.U31DoubleArc) {
        <div class="ui-group" [style.opacity]="k.useViolCornerUC ? 0.5 : 1"
            [style.pointerEvents]="k.useViolCornerUC ? 'none' : 'auto'">
            <div class="input-group basic-row field-row" role="group">
                <label class="field-cell">
                    <span class="field-title">U31 Radius</span>
                    <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.U31R" (input)="recordEditAndRedraw()"
                        [style.borderColor]="pal.ink(4)"
                        (focus)="highlightPart('U31', pal.ink(4))" (blur)="clearHighlight()" />
                </label>
                <label class="field-cell">
                    <span class="field-title">U31 Sweep <span class="unit-label">°</span></span>
                    <input type="number" class="basic-input" step="1" min="0" max="180" [(ngModel)]="k.U31Sweep" (input)="recordEditAndRedraw()"
                        (focus)="highlightPart('U31', pal.ink(4))" (blur)="clearHighlight()" />
                </label>
                <label class="field-cell">
                    <span class="field-title">U31 to LBW</span>
                    <div class="basic-display" aria-label="Upper compound corner radius to lower bout width ratio value">{{ formatRatio('U31toLBW') }}</div>
                </label>
                <button type="button" class="info-icon" (click)="showFieldHelp('compoundArc')" title="More information"
                    aria-label="Information">ⓘ</button>
            </div>
        </div>
        }
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">C2 Corner Radius</span>
                <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.C2R" (input)="recordEditAndRedraw()"
                    [style.borderColor]="pal.ink(4)"
                    (focus)="highlightPart('C2', pal.ink(4))" (blur)="clearHighlight()" />
            </label>
            <label class="field-cell">
                <div class="toggle">
                    <input type="checkbox" [(ngModel)]="k.C21DoubleArc" (change)="recordEditAndRedraw()" /><span>Compound</span>
                </div>
            </label>
            <label class="field-cell">
                <span class="field-title">C2 to LBW</span>
                <div class="basic-display" aria-label="Upper center bout radius to lower bout width ratio value">{{ formatRatio('C2toLBW') }}</div>
            </label>
        </div>
        @if (k.C21DoubleArc) {
        <div class="ui-group">
            <div class="input-group basic-row field-row" role="group">
                <label class="field-cell">
                    <span class="field-title">C21 Radius</span>
                    <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.C21R" (input)="recordEditAndRedraw()"
                        [style.borderColor]="pal.ink(4)"
                        (focus)="highlightPart('C21', pal.ink(4))" (blur)="clearHighlight()" />
                </label>
                <label class="field-cell">
                    <span class="field-title">C21 Sweep <span class="unit-label">°</span></span>
                    <input type="number" class="basic-input" step="1" min="0" max="180" [(ngModel)]="k.C21Sweep" (input)="recordEditAndRedraw()"
                        (focus)="highlightPart('C21', pal.ink(4))" (blur)="clearHighlight()" />
                </label>
                <label class="field-cell">
                    <span class="field-title">C21 to LBW</span>
                    <div class="basic-display" aria-label="Upper compound corner radius to lower bout width ratio value">{{ formatRatio('C21toLBW') }}</div>
                </label>
                <button type="button" class="info-icon" (click)="showFieldHelp('compoundArc')" title="More information"
                    aria-label="Information">ⓘ</button>
            </div>
        </div>
        }
        <div class="input-group basic-row field-row">
            <div class="toggle">
                <input type="checkbox" [(ngModel)]="k.useViolCornerUC" (change)="recordEditAndRedraw()" /><span>Use Viol Corner</span>
            </div>
            <button type="button" class="info-icon" (click)="showFieldHelp('violCorner')" title="More information"
                aria-label="Information">ⓘ</button>
        </div>
    </div>
</section>

<section class="ui-group">
    <div class="ui-group-title">Center Bout</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Total Width</span>
            @if (bouts.useKellyC0) {
            <div class="basic-display" aria-label="Fitted center bout width">{{ c.CBW?.toFixed(1) ?? '–' }}</div>
            } @else {
            <input type="number" class="basic-input" step="1" min="1" [(ngModel)]="bouts.CBW" (input)="recordEditAndRedraw()" />
            }
        </label>
        <button type="button" class="info-icon" (click)="showFieldHelp('centerBoutWidth')" title="More information"
            aria-label="Information">ⓘ</button>
        <label class="field-cell"></label>
        <label class="field-cell">
            <span class="field-title">CBW to LBW</span>
            <div class="basic-display" aria-label="Center bout width to lower bout width ratio value">{{ formatRatio('CBWtoLBW') }}</div>
        </label>
    </div>
    <div class="ui-group">
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">C0 Radius</span>
                <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="bouts.C0R" (input)="recordEditAndRedraw()"
                    [style.borderColor]="pal.ink(3)"
                    (focus)="highlightPart('C0', pal.ink(3))" (blur)="clearHighlight()" />
            </label>
            <label class="field-cell">
                <span class="field-title">C0 Y</span>
                @if (bouts.useKellyC0) {
                <div class="basic-display" aria-label="Fitted C0 height">{{ c.C0?.y?.toFixed(1) ?? '–' }}</div>
                } @else {
                <input type="number" class="basic-input" step="1" [(ngModel)]="bouts.C0Y" (input)="recordEditAndRedraw()"
                    [style.borderColor]="pal.ink(3)"
                    (focus)="highlightPart('C0', pal.ink(3))" (blur)="clearHighlight()" />
                }
            </label>
            <label class="field-cell">
                <span class="field-title">C0 to LBW</span>
                <div class="basic-display" aria-label="Center bout radius to lower bout width ratio value">{{ formatRatio('C0toLBW') }}</div>
            </label>
        </div>
        <div class="input-group basic-row field-row" role="group">
            <div class="toggle">
                <input type="checkbox" [(ngModel)]="bouts.useKellyC0" (change)="fitChanged()" /><span>Fit C0 to Bouts</span>
            </div>
            <button type="button" class="info-icon" (click)="showFieldHelp('fitC0')" title="More information"
                aria-label="Information">ⓘ</button>
        </div>
    </div>
</section>

    <div class="ui-group-title">Lower Corner</div>
    <div class="input-group basic-row field-row" role="group">
        <div class="field-cell field-cell--xy">
            <div class="xy-titles">
                <span class="field-title">X</span>
                <span class="field-title">Y</span>
            </div>
            <div class="xy-field" data-xy-point role="group" aria-label="Lower corner position"
                [style.borderColor]="pal.ink(2).faint(5)" title="Arrow keys move the corner from either box">
                <input type="number" class="basic-input" step="1" data-xy="x" aria-label="Lower corner X"
                    [(ngModel)]="k.LCr.x" (input)="recordEditAndRedraw()"
                    (focus)="highlightPart('LCr', pal.ink(2).faint(5))" (blur)="clearHighlight()" />
                <input type="number" class="basic-input" step="1" data-xy="y" aria-label="Lower corner Y"

                </div>
            </label>
            <label class="field-cell">
                <span class="field-title">C1 to LBW</span>
                <div class="basic-display" aria-label="Lower center bout radius to lower bout width ratio value">{{ formatRatio('C1toLBW') }}</div>
            </label>
        </div>
        @if (k.C11DoubleArc) {
        <div class="ui-group">
            <div class="input-group basic-row field-row" role="group">
                <label class="field-cell">
                    <span class="field-title">C11 Radius</span>
                    <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.C11R" (input)="recordEditAndRedraw()"
                        [style.borderColor]="pal.ink(2)"
                        (focus)="highlightPart('C11', pal.ink(2))" (blur)="clearHighlight()" />
                </label>
                <label class="field-cell">
                    <span class="field-title">C11 Sweep <span class="unit-label">°</span></span>
                    <input type="number" class="basic-input" step="1" min="0" max="180" [(ngModel)]="k.C11Sweep" (input)="recordEditAndRedraw()"
                        (focus)="highlightPart('C11', pal.ink(2))" (blur)="clearHighlight()" />
                </label>
                <label class="field-cell">
                    <span class="field-title">C11 to LBW</span>
                    <div class="basic-display" aria-label="Lower compound corner radius to lower bout width ratio value">{{ formatRatio('C11toLBW') }}</div>
                </label>
                <button type="button" class="info-icon" (click)="showFieldHelp('compoundArc')" title="More information"
                    aria-label="Information">ⓘ</button>
            </div>
        </div>
        }
        <div class="input-group basic-row field-row" role="group"
            [style.opacity]="k.useViolCornerLC ? 0.5 : 1" [style.pointerEvents]="k.useViolCornerLC ? 'none' : 'auto'">
            <label class="field-cell">
                <span class="field-title">L3 Corner Radius</span>
                <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.L3R" (input)="recordEditAndRedraw()"
                    [style.borderColor]="pal.ink(2)"
                    (focus)="highlightPart('L3', pal.ink(2))" (blur)="clearHighlight()" />
            </label>
            <label class="field-cell">
                <div class="toggle">
                    <input type="checkbox" [(ngModel)]="k.L31DoubleArc" (change)="recordEditAndRedraw()" /><span>Compound</span>
                </div>
            </label>
            <label class="field-cell">
                <span class="field-title">L3 to LBW</span>
                <div class="basic-display" aria-label="L3 to lower bout width ratio value">{{ formatRatio('L3toLBW') }}</div>
            </label>
        </div>
        @if (k.L31DoubleArc) {
        <div class="ui-group" [style.opacity]="k.useViolCornerLC ? 0.5 : 1"
            [style.pointerEvents]="k.useViolCornerLC ? 'none' : 'auto'">
            <div class="input-group basic-row field-row" role="group">
                <label class="field-cell">
                    <span class="field-title">L31 Radius</span>
                    <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="k.L31R" (input)="recordEditAndRedraw()"
                        [style.borderColor]="pal.ink(2)"
                        (focus)="highlightPart('L31', pal.ink(2))" (blur)="clearHighlight()" />
                </label>
                <label class="field-cell">
                    <span class="field-title">L31 Sweep <span class="unit-label">°</span></span>
                    <input type="number" class="basic-input" step="1" min="0" max="180" [(ngModel)]="k.L31Sweep" (input)="recordEditAndRedraw()"
                        (focus)="highlightPart('L31', pal.ink(2))" (blur)="clearHighlight()" />
                </label>
                <label class="field-cell">
                    <span class="field-title">L31 to LBW</span>
                    <div class="basic-display" aria-label="Lower compound corner radius to lower bout width ratio value">{{ formatRatio('L31toLBW') }}</div>
                </label>
                <button type="button" class="info-icon" (click)="showFieldHelp('compoundArc')" title="More information"
                    aria-label="Information">ⓘ</button>
            </div>
        </div>
        }
        <div class="input-group basic-row field-row">
            <div class="toggle">
                <input type="checkbox" [(ngModel)]="k.useViolCornerLC" (change)="recordEditAndRedraw()" /><span>Use Viol Corner</span>
            </div>
            <button type="button" class="info-icon" (click)="showFieldHelp('violCorner')" title="More information"
                aria-label="Information">ⓘ</button>
        </div>
    </div>
</section>
