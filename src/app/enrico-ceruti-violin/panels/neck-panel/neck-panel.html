    @if (params.neck) {

    <section class="ui-group" [style.border-color]="colors.neck">
        <div class="ui-group-title">Neck</div>
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">Length <span class="unit-label">mm</span></span>
                <input class="basic-input" type="number" step="1" min="1" [style.border-color]="colors.neck"
                    [(ngModel)]="neck.length" (input)="onChange()" (focus)="onFieldFocus('length', colors.neck)"
                    (blur)="onFieldBlur()" />
            </label>
            <label class="field-cell">
                <span class="field-title">Thickness <span class="unit-label">mm</span></span>
                <input class="basic-input" type="number" step="0.5" min="1" [style.border-color]="colors.neck"
                    [(ngModel)]="neck.thickness" (input)="onChange()" (focus)="onFieldFocus('thickness', colors.neck)"
                    (blur)="onFieldBlur()" />
            </label>
        </div>
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">Top Width <span class="unit-label">mm</span></span>
                <input class="basic-input" type="number" step="0.5" min="1" [style.border-color]="colors.neck"
                    [(ngModel)]="neck.topWidth" (input)="onChange()" (focus)="onFieldFocus('topWidth', colors.neck)"
                    (blur)="onFieldBlur()" />
            </label>
        </div>
    </section>

    <section class="ui-group" [style.border-color]="colors.neckRoot">
        <div class="ui-group-title">Neck Root</div>
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">Heel Radius <span class="unit-label">mm</span></span>
                <input class="basic-input" type="number" step="1" min="1" [style.border-color]="colors.neckRoot"
                    [(ngModel)]="neck.heel.r" (input)="onChange()" (focus)="onFieldFocus('heel', colors.neckRoot)"
                    (blur)="onFieldBlur()" />
            </label>
            <label class="field-cell">
                <span class="field-title">Button Height <span class="unit-label">mm</span></span>
                <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="colors.archBack"
                    [(ngModel)]="params.button.height" (input)="onChange()"
                    (focus)="onFieldFocus('buttonHeight', colors.archBack)" (blur)="onFieldBlur()" />
            </label>

        </div>
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">Mortise <span class="unit-label">mm</span></span>
                <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="colors.neckRoot"
                    [(ngModel)]="neck.mortiseDepth" (input)="onChange()" (focus)="onFieldFocus('mortise', colors.neckRoot)"
                    (blur)="onFieldBlur()" />
            </label>
            <label class="field-cell">
                <span class="field-title">Overstand <span class="unit-label">mm</span></span>
                <input class="basic-input" type="number" step="0.5" min="0" [style.border-color]="colors.neckRoot"
                    [(ngModel)]="neck.overstand" (input)="onChange()" (focus)="onFieldFocus('overstand', colors.neckRoot)"
                    (blur)="onFieldBlur()" />
            </label>
        </div>
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">Neck Projection <span class="unit-label">°</span></span>
                <input class="basic-input" type="number" step="0.5" min="0" max="30" [ngModel]="angleDeg"
                    (ngModelChange)="setAngleDeg($event)" (focus)="onFieldFocus('angle', colors.neck)"
                    (blur)="onFieldBlur()" />
            </label>
        </div>
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">Root Width <span class="unit-label">mm</span></span>
                <input class="basic-input" type="number" step="0.5" min="1" [style.border-color]="colors.neck"
                    [(ngModel)]="neck.rootWidth" (input)="onChange()" (focus)="onFieldFocus('rootWidth', colors.neck)"
                    (blur)="onFieldBlur()" />
            </label>
        </div>

    </section>

    }
