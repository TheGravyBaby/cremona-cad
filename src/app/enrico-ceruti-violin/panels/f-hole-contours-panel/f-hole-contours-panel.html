<section class="ui-group" [style.border-color]="colors.fHoleUpper">
    <div class="ui-group-title">Upper</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">U1 Radius<span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10" min="0"
                [ngModel]="round2(params.fHoles!.U1!.r)" (ngModelChange)="params.fHoles!.U1!.r = $event; onChange(); onArcFocus('U1', colors.fHoleUpperDark)"
                [style.borderColor]="colors.fHoleUpperDark" (focus)="onArcFocus('U1', colors.fHoleUpperDark)" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Extend Angle<span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10"
                [ngModel]="round2(params.fHoles!.U1!.end)"
                (ngModelChange)="params.fHoles!.U1!.end = $event; onChange()" />
        </label>
        <button type="button" class="info-icon" (click)="fholeShoulderExtendInfo()" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">U2 Radius<span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10" min="0"
                [ngModel]="round2(params.fHoles!.U2!.r)" (ngModelChange)="params.fHoles!.U2!.r = $event; onChange(); onArcFocus('U2', colors.fHoleUpper)"
                [style.borderColor]="colors.fHoleUpper" (focus)="onArcFocus('U2', colors.fHoleUpper)" (blur)="onArcBlur()" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">U3 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10" min="0"
                [ngModel]="round2(params.fHoles!.U3!.r)" (ngModelChange)="params.fHoles!.U3!.r = $event; onChange(); onArcFocus('U3', colors.fHoleUpperLight)"
                [style.borderColor]="colors.fHoleUpperLight" (focus)="onArcFocus('U3', colors.fHoleUpperLight)" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">U3 End Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10"
                [ngModel]="getArcEndDeg(params.fHoles!.U3!)"
                (ngModelChange)="setArcEndDeg(params.fHoles!.U3!, $event, onChange.bind(this)); onArcFocus('U3', colors.fHoleUpperLight)"
                (focus)="onArcFocus('U3', colors.fHoleUpperLight)" (blur)="onArcBlur()" 
                />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Wing <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10"
                min="0" [ngModel]="round2(params.fHoles!.UCut!.length)"
                (ngModelChange)="params.fHoles!.UCut!.length = $event; onChange(); onArcFocus('UCut', colors.fHoleCut)" [style.borderColor]="colors.fHoleCut"
                (focus)="onArcFocus('UCut', colors.fHoleCut)" (blur)="onArcBlur()" />
        </label>
         <label class="field-cell">
            <span class="field-title">Slope <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10"
                [ngModel]="getFieldDeg(params.fHoles!.UCut!, 'slope')"
                (ngModelChange)="setFieldDeg(params.fHoles!.UCut!, 'slope', $event, onChange.bind(this))"
                (focus)="onArcFocus('UCut', colors.fHoleCut)" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Eye Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10"
                [ngModel]="getFieldDeg(params.fHoles!.UCut!, 'angleOnEye')"
                (ngModelChange)="setFieldDeg(params.fHoles!.UCut!, 'angleOnEye', $event, onChange.bind(this))"
                (focus)="onArcFocus('UCut', colors.fHoleCut)" (blur)="onArcBlur()" />
        </label>
        <button type="button" class="info-icon" (click)="fholeCutInfo()" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
</section>

<section class="ui-group" [style.border-color]="colors.fHoleStem">
    <div class="ui-group-title">Stem</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Arc Radius<span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10" min="0"
                [ngModel]="round2(params.fHoles!.stem.arcR)" (ngModelChange)="params.fHoles!.stem.arcR = $event; onChange()"
                [style.borderColor]="colors.fHoleStem" />
        </label>
    </div>
</section>
