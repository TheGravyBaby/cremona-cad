<section class="ui-group">
    <div class="ui-group-title">Upper Corner</div>
       <div class="input-group basic-row field-row" role="group">
        <div class="field-cell field-cell--xy">
            <div class="xy-titles">
                <span class="field-title">X <span class="unit-label">mm</span></span>
                <span class="field-title">Y <span class="unit-label">mm</span></span>
            </div>
            <div class="xy-field" data-xy-point role="group" aria-label="Upper corner position"
                [style.borderColor]="pal.ink(4).faint(5)"
                title="Arrow keys move the corner from either box">
                <input type="number" class="basic-input" step="1" data-xy="x" aria-label="Upper corner X"
                    [(ngModel)]="params.bouts.UCr!.x"
                    (input)="onChange(); onCornerFocus('upper')" (focus)="onCornerFocus('upper')" (blur)="onArcBlur()" />
                <input type="number" class="basic-input" step="1" data-xy="y" aria-label="Upper corner Y"
                    [(ngModel)]="params.bouts.UCr!.y"
                    (input)="onChange(); onCornerFocus('upper')" (focus)="onCornerFocus('upper')" (blur)="onArcBlur()" />
            </div>
        </div>
        <div class="field-cell">
            <button type="button" class="recipe-btn" (click)="resetCorner('upper')"
                title="Set the upper corner to a default position">Default</button>
        </div>
        <button type="button" class="info-icon" (click)="help('cornerPosition')" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
    <div class="ui-group">
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">C2 Corner Radius <span class="unit-label">mm</span></span>
                <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="params.bouts.C2!.r"
                    (input)="onChange(); onArcFocus(params.bouts.C2!, pal.ink(4))" [style.borderColor]="pal.ink(4)"
                    (focus)="onArcFocus(params.bouts.C2!, pal.ink(4))" (blur)="onArcBlur()" />
            </label>
            <label class="field-cell">
                <div class="toggle">
                    <input type="checkbox" [(ngModel)]="params.options.C21DoubleArc"
                        (change)="onChange()" /><span>Compound</span>
                </div>
            </label>
            <label class="field-cell">
                <span class="field-title">C2 to LBW</span>
                <div class="basic-display"
                    aria-label="Upper center bout radius to lower bout width ratio value">{{
                    nearestFraction(params.ratios.C2toLBW) }}</div>
            </label>
        </div>
        @if (params.options.C21DoubleArc) {
        <div class="ui-group">
            <div class="input-group basic-row field-row" role="group">
                <label class="field-cell">
                    <span class="field-title">C21 Radius <span class="unit-label">mm</span></span>
                    <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="params.bouts.C21!.r"
                        (input)="onChange(); onArcFocus(params.bouts.C21!, pal.ink(4))" [style.borderColor]="pal.ink(4)"
                        (focus)="onArcFocus(params.bouts.C21!, pal.ink(4))" (blur)="onArcBlur()" />
                </label>
                <label class="field-cell">
                    <span class="field-title">Split Angle <span class="unit-label">°</span></span>
                    <input type="number" class="basic-input" step="1" [ngModel]="params.bouts.C21!.degreeDiff"
                        (ngModelChange)="adjustArcStart(params.bouts.C21!, $event, onChange.bind(this)); onArcFocus(params.bouts.C21!, pal.ink(4))"
                        [style.borderColor]="pal.ink(4)"
                        (focus)="onArcFocus(params.bouts.C21!, pal.ink(4))" (blur)="onArcBlur()" />
                </label>
                <label class="field-cell">
                    <span class="field-title">C21 to LBW</span>
                    <div class="basic-display"
                        aria-label="Upper compound corner radius to lower bout width ratio value">{{
                        nearestFraction(params.ratios.C21toLBW) }}</div>
                </label>
            </div>
        </div>
        }
    </div>
</section>

<section class="ui-group">
    <div class="ui-group-title">Center Bout</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell" [style.opacity]="params.options.useKellyC0 ? 0.5 : 1">
            <span class="field-title">Total Width <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" min="1" [(ngModel)]="params.bouts.CBW"
                (input)="onManualEdit()" [disabled]="params.options.useKellyC0" />
        </label>
        <button type="button" class="info-icon" (click)="help('centerBoutWidth')" title="More information"
            aria-label="Information">ⓘ</button>
        <label class="field-cell"></label>
        <label class="field-cell">
            <span class="field-title">CBW to LBW</span>
            <div class="basic-display" aria-label="Center bout width to lower bout width ratio value">{{
                nearestFraction(params.ratios.CBWtoLBW) }}</div>
        </label>
    </div>
    <div class="ui-group">
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">C0 Radius <span class="unit-label">mm</span></span>
                <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="params.bouts.C0!.r"
                    (input)="onChange(); onArcFocus(params.bouts.C0!, pal.ink(3))" [style.borderColor]="pal.ink(3)"
                    (focus)="onArcFocus(params.bouts.C0!, pal.ink(3))" (blur)="onArcBlur()" />
            </label>
            <label class="field-cell" [style.opacity]="params.options.useKellyC0 ? 0.0 : 1"
                [style.pointerEvents]="params.options.useKellyC0 ? 'none' : 'auto'">
                <span class="field-title">C0 Y <span class="unit-label">mm</span></span>
                <input type="number" class="basic-input" step="1" [(ngModel)]="params.bouts.C0!.y"
                    (input)="onManualEdit(); onArcFocus(params.bouts.C0!, pal.ink(3))" [style.borderColor]="pal.ink(3)"
                    [disabled]="params.options.useKellyC0"
                    (focus)="onArcFocus(params.bouts.C0!, pal.ink(3))" (blur)="onArcBlur()" />
            </label>
            <label class="field-cell">
                <span class="field-title">C0 to LBW</span>
                <div class="basic-display" aria-label="Center bout radius to lower bout width ratio value">{{
                    nearestFraction(params.ratios.C0toLBW) }}</div>
            </label>
        </div>
        <div class="input-group basic-row field-row" role="group">
            <div class="toggle">
                <input type="checkbox" [(ngModel)]="params.options.useKellyC0"
                    (change)="onChange()" /><span>Fit C0 to Bouts</span>
            </div>
            <button type="button" class="info-icon" (click)="help('fitC0')" title="More information"
                aria-label="Information">ⓘ</button>
        </div>
    </div>

</section>

<section class="ui-group">
    <div class="ui-group-title">Lower Corner</div>
    <div class="input-group basic-row field-row" role="group">
        <div class="field-cell field-cell--xy">
            <div class="xy-titles">
                <span class="field-title">X <span class="unit-label">mm</span></span>
                <span class="field-title">Y <span class="unit-label">mm</span></span>
            </div>
            <div class="xy-field" data-xy-point role="group" aria-label="Lower corner position"
                [style.borderColor]="pal.ink(2).faint(5)"
                title="Arrow keys move the corner from either box">
                <input type="number" class="basic-input" step="1" data-xy="x" aria-label="Lower corner X"
                    [(ngModel)]="params.bouts.LCr!.x"
                    (input)="onChange(); onCornerFocus('lower')" (focus)="onCornerFocus('lower')" (blur)="onArcBlur()" />
                <input type="number" class="basic-input" step="1" data-xy="y" aria-label="Lower corner Y"
                    [(ngModel)]="params.bouts.LCr!.y"
                    (input)="onChange(); onCornerFocus('lower')" (focus)="onCornerFocus('lower')" (blur)="onArcBlur()" />
            </div>
        </div>
        <div class="field-cell">
            <button type="button" class="recipe-btn" (click)="resetCorner('lower')"
                title="Set the lower corner to a default position">Default</button>
        </div>
        <button type="button" class="info-icon" (click)="help('cornerPosition')" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
    <div class="ui-group">
        <div class="input-group basic-row field-row" role="group">
            <label class="field-cell">
                <span class="field-title">C1 Corner Radius <span class="unit-label">mm</span></span>
                <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="params.bouts.C1!.r"
                    (input)="onChange(); onArcFocus(params.bouts.C1!, pal.ink(2))" [style.borderColor]="pal.ink(2)"
                    (focus)="onArcFocus(params.bouts.C1!, pal.ink(2))" (blur)="onArcBlur()" />
            </label>
            <label class="field-cell">
                <div class="toggle">
                    <input type="checkbox" [(ngModel)]="params.options.C11DoubleArc"
                        (change)="onChange()" /><span>Compound</span>
                </div>
            </label>
            <label class="field-cell">
                <span class="field-title">C1 to LBW</span>
                <div class="basic-display"
                    aria-label="Lower center bout radius to lower bout width ratio value">{{
                    nearestFraction(params.ratios.C1toLBW) }}</div>
            </label>
        </div>
        @if (params.options.C11DoubleArc) {
        <div class="ui-group">
            <div class="input-group basic-row field-row" role="group">
                <label class="field-cell">
                    <span class="field-title">C11 Radius <span class="unit-label">mm</span></span>
                    <input type="number" class="basic-input" step="1" min="0" [(ngModel)]="params.bouts.C11!.r"
                        (input)="onChange(); onArcFocus(params.bouts.C11!, pal.ink(2))" [style.borderColor]="pal.ink(2)"
                        (focus)="onArcFocus(params.bouts.C11!, pal.ink(2))" (blur)="onArcBlur()" />
                </label>
                <label class="field-cell">
                    <span class="field-title">Split Angle <span class="unit-label">°</span></span>
                    <input type="number" class="basic-input" step="1" [ngModel]="params.bouts.C11!.degreeDiff"
                        (ngModelChange)="adjustArcStart(params.bouts.C11!, $event, onChange.bind(this)); onArcFocus(params.bouts.C11!, pal.ink(2))"
                        [style.borderColor]="pal.ink(2)"
                        (focus)="onArcFocus(params.bouts.C11!, pal.ink(2))" (blur)="onArcBlur()" />
                </label>
                <label class="field-cell">
                    <span class="field-title">C11 to LBW</span>
                    <div class="basic-display"
                        aria-label="Lower compound corner radius to lower bout width ratio value">{{
                        nearestFraction(params.ratios.C11toLBW) }}</div>
                </label>
            </div>
        </div>
        }
    </div>
</section>
