<section class="ui-group" [style.border-color]="colors.fHoleUpper">
    <div class="ui-group-title">Outer Arm</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">O1 Radius<span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.O1!.r, 1)" min="0"
                [ngModel]="round2(params.fHoles!.O1!.r)" (ngModelChange)="params.fHoles!.O1!.r = $event; onChange(); onArcFocus('O1', colors.fHoleUpper)"
                [style.borderColor]="colors.fHoleUpper" (focus)="onArcFocus('O1', colors.fHoleUpper)" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Extend Angle<span class="unit-label">°</span></span>
            <input type="number" class="basic-input" [step]="1" min="0"
                [ngModel]="getShoulderExtendDeg(params.fHoles!.O1!, 1)"
                (ngModelChange)="setShoulderExtendDeg(params.fHoles!.O1!, 1, $event); onArcFocus('O1', colors.fHoleUpper)"
                (focus)="onArcFocus('O1', colors.fHoleUpper)" (blur)="onArcBlur()" />
        </label>
        <button type="button" class="info-icon" (click)="fholeShoulderExtendInfo()" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">O2 Radius<span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.O2!.r, 1)" min="0"
                [ngModel]="round2(params.fHoles!.O2!.r)" (ngModelChange)="params.fHoles!.O2!.r = $event; onChange(); onArcFocus('O2', colors.fHoleUpper)"
                [style.borderColor]="colors.fHoleUpper" (focus)="onArcFocus('O2', colors.fHoleUpper)" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">O3 Radius<span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.O3!.r, 1)" min="0"
                [ngModel]="round2(params.fHoles!.O3!.r)" (ngModelChange)="params.fHoles!.O3!.r = $event; onChange(); onArcFocus('O3', colors.fHoleStemOff)"
                [style.borderColor]="colors.fHoleStemOff" (focus)="onArcFocus('O3', colors.fHoleStemOff)" (blur)="onArcBlur()" />
        </label>
    </div>
</section>

                (focus)="onArcFocus('UCut', colors.fHoleCutUpper)" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Cut At <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" [step]="stepFor(getCutDeg(params.fHoles!.UCut!, 'angleOnEye'), 1)"
                [ngModel]="getCutDeg(params.fHoles!.UCut!, 'angleOnEye')"
                (ngModelChange)="setCutDeg(params.fHoles!.UCut!, 'angleOnEye', $event); onArcFocus('UCut', colors.fHoleCutUpper)"
                (focus)="onArcFocus('UCut', colors.fHoleCutUpper)" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Slope <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" [step]="stepFor(getCutDeg(params.fHoles!.UCut!, 'slope'), 1)"
                [ngModel]="getCutDeg(params.fHoles!.UCut!, 'slope')"
                (ngModelChange)="setCutDeg(params.fHoles!.UCut!, 'slope', $event); onArcFocus('UCut', colors.fHoleCutUpper)"
                (focus)="onArcFocus('UCut', colors.fHoleCutUpper)" (blur)="onArcBlur()" />
        </label>

        <button type="button" class="info-icon" (click)="fholeCutInfo()" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
</section>
