<div class="lc-group">
  <div class="lc-strip">
    <button type="button" class="lc-btn" [class.active]="open" (click)="toggleOpen()" title="Axes and grid">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20V4" />
        <path d="M1.5 8L4 4l2.5 4" />
        <path d="M4 20h16" />
        <path d="M16 22.5L20 20l-4-2.5" />
      </svg>
    </button>
    <button type="button" class="lc-eye" [class.on]="axisGrid.visible"
      [title]="axisGrid.visible ? 'Hide axes and grid' : 'Show axes and grid'" (click)="toggle('visible')">
      <ng-container [ngTemplateOutlet]="eyeIcon" [ngTemplateOutletContext]="{ on: axisGrid.visible }" />
    </button>
  </div>

  @if (open) {
  <div class="lc-popup">
    <div class="layer-tabs">
      <div class="layer-tab axis-row" [class.off-panel]="!axisGrid.visible">
        <button type="button" class="layer-tab-icon-btn" (click)="toggle('showAxes')"
          [title]="axisGrid.showAxes ? 'Hide axes' : 'Show axes'">
          <ng-container [ngTemplateOutlet]="eyeIcon" [ngTemplateOutletContext]="{ on: axisGrid.showAxes }" />
        </button>
        <span class="layer-tab-label"
          title="The two lines through the origin, numbered along the view's edges at the grid steps.">Axes</span>
      </div>
      <div class="layer-tab axis-row" [class.off-panel]="!axisGrid.visible">
        <button type="button" class="layer-tab-icon-btn" (click)="toggle('showGridX')"
          [title]="axisGrid.showGridX ? 'Hide vertical grid lines' : 'Show vertical grid lines'">
          <ng-container [ngTemplateOutlet]="eyeIcon" [ngTemplateOutletContext]="{ on: axisGrid.showGridX }" />
        </button>
        <span class="layer-tab-label" title="Vertical lines, one every step along X. Also spaces the X axis numbers.">X grid</span>
        <input #stepX class="axis-step" type="number" min="0.1" step="0.1" [value]="axisGrid.gridStepX"
          (change)="setStep('gridStepX', stepX)" title="X step, mm" />
        <span class="axis-unit">mm</span>
      </div>
      <div class="layer-tab axis-row" [class.off-panel]="!axisGrid.visible">
        <button type="button" class="layer-tab-icon-btn" (click)="toggle('showGridY')"
          [title]="axisGrid.showGridY ? 'Hide horizontal grid lines' : 'Show horizontal grid lines'">
          <ng-container [ngTemplateOutlet]="eyeIcon" [ngTemplateOutletContext]="{ on: axisGrid.showGridY }" />
        </button>
        <span class="layer-tab-label" title="Horizontal lines, one every step along Y. Also spaces the Y axis numbers.">Y grid</span>
        <input #stepY class="axis-step" type="number" min="0.1" step="0.1" [value]="axisGrid.gridStepY"
          (change)="setStep('gridStepY', stepY)" title="Y step, mm" />
        <span class="axis-unit">mm</span>
      </div>
    </div>
  </div>
  }
</div>

<ng-template #eyeIcon let-on="on">
  @if (on) {
  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
    <circle cx="12" cy="12" r="3" />
  </svg>
  } @else {
  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round">
    <path
      d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24" />
    <line x1="1" y1="1" x2="23" y2="23" />
  </svg>
  }
</ng-template>
