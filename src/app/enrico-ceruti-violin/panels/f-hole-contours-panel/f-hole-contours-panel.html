<section class="ui-group" [style.border-color]="colors.fHoleUpper">
    <div class="ui-group-title">Upper</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">O1 Radius<span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10" min="0"
                [ngModel]="round2(params.fHoles!.O1!.r)" (ngModelChange)="params.fHoles!.O1!.r = $event; onChange(); onArcFocus('O1', colors.fHoleUpperDark)"
                [style.borderColor]="colors.fHoleUpperDark" (focus)="onArcFocus('O1', colors.fHoleUpperDark)" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Extend Angle<span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10"
                [ngModel]="getShoulderExtendDeg(params.fHoles!.O1!, 1)"
                (ngModelChange)="setShoulderExtendDeg(params.fHoles!.O1!, 1, $event); onArcFocus('O1', colors.fHoleUpperDark)"
                (focus)="onArcFocus('O1', colors.fHoleUpperDark)" (blur)="onArcBlur()" />
        </label>
        <button type="button" class="info-icon" (click)="fholeShoulderExtendInfo()" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">O2 Radius<span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10" min="0"
                [ngModel]="round2(params.fHoles!.O2!.r)" (ngModelChange)="params.fHoles!.O2!.r = $event; onChange(); onArcFocus('O2', colors.fHoleUpper)"
                [style.borderColor]="colors.fHoleUpper" (focus)="onArcFocus('O2', colors.fHoleUpper)" (blur)="onArcBlur()" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">I5 Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10" min="0"
                [ngModel]="round2(params.fHoles!.I5!.r)" (ngModelChange)="params.fHoles!.I5!.r = $event; onChange(); onArcFocus('I5', colors.fHoleUpperLight)"
                [style.borderColor]="colors.fHoleUpperLight" (focus)="onArcFocus('I5', colors.fHoleUpperLight)" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">I5 End Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10"
                [ngModel]="getArcEndDeg(params.fHoles!.I5!)"
                (ngModelChange)="setArcEndDeg(params.fHoles!.I5!, $event, onChange.bind(this)); onArcFocus('I5', colors.fHoleUpperLight)"
                (focus)="onArcFocus('I5', colors.fHoleUpperLight)" (blur)="onArcBlur()" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Length <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10"
                min="0" [ngModel]="round2(params.fHoles!.UCut!.length)"
                (ngModelChange)="params.fHoles!.UCut!.length = $event; onChange(); onArcFocus('UCut', colors.fHoleUpperLine)" [style.borderColor]="colors.fHoleUpperLine"
                (focus)="onArcFocus('UCut', colors.fHoleUpperLine)" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Cut At <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10"
                [ngModel]="getCutDeg(params.fHoles!.UCut!, 'angleOnEye')"
                (ngModelChange)="setCutDeg(params.fHoles!.UCut!, 'angleOnEye', $event); onArcFocus('UCut', colors.fHoleUpperLine)"
                (focus)="onArcFocus('UCut', colors.fHoleUpperLine)" (blur)="onArcBlur()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Slope <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10"
                [ngModel]="getCutDeg(params.fHoles!.UCut!, 'slope')"
                (ngModelChange)="setCutDeg(params.fHoles!.UCut!, 'slope', $event); onArcFocus('UCut', colors.fHoleUpperLine)"
                (focus)="onArcFocus('UCut', colors.fHoleUpperLine)" (blur)="onArcBlur()" />
        </label>

        <button type="button" class="info-icon" (click)="fholeCutInfo()" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
</section>

<section class="ui-group" [style.border-color]="colors.fHoleStem">
    <div class="ui-group-title">Stem</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Arc Radius<span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" step="1" data-fine-step="0.1" data-shift-step="10" min="0"
                [ngModel]="round2(params.fHoles!.stem.arcR)" (ngModelChange)="params.fHoles!.stem.arcR = $event; onChange()"
                [style.borderColor]="colors.fHoleStem" />
        </label>
    </div>
</section>
