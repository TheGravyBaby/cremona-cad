<section class="ui-group" [style.border-color]="colors.fHoleUpper">
    <div class="ui-group-title">Upper Eye</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.upper.eye!.r, .25)" data-fine-step="0.25"
                min="0" [ngModel]="round2(params.fHoles!.upper.eye!.r)"
                (ngModelChange)="params.fHoles!.upper.eye!.r = $event; onChange()"
                [style.borderColor]="colors.fHoleUpper" />
        </label>
        <label class="field-cell"></label>
        <label class='field-cell'>
            <span class="field-title">U to L</span>
            <div class="basic-display" aria-label="Upper bout to upper bout width ratio value">{{
                nearestFraction(params.ratios.FUtoL) }}</div>
        </label>
    </div>

    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">X <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.upper.eye!.x, .25)" data-fine-step="0.25"
                min="0" [ngModel]="round2(params.fHoles!.upper.eye!.x)"
                (ngModelChange)="params.fHoles!.upper.eye!.x = $event; onChange()"
                [style.borderColor]="colors.fHoleUpperOff" />
        </label>
        <label class="field-cell">
            <span class="field-title">Y <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.upper.eye!.y, .25)" data-fine-step="0.25"
                min="0" [ngModel]="round2(params.fHoles!.upper.eye!.y)"
                (ngModelChange)="params.fHoles!.upper.eye!.y = $event; onChange()"
                [style.borderColor]="colors.fHoleUpperOff" />
        </label>
    </div>

    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Rise <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.upper.rise, .25)" data-fine-step="0.25"
                min="0" [ngModel]="round2(params.fHoles!.upper.rise)"
                (ngModelChange)="params.fHoles!.upper.rise = $event; onChange()"/>
        </label>

    </div>

</section>

<section class="ui-group" [style.border-color]="colors.fHoleStem">
    <div class="ui-group-title">Stem</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.stem.width, .25)"
                data-fine-step="0.25" min="0" [ngModel]="round2(params.fHoles!.stem.width)"
                (ngModelChange)="params.fHoles!.stem.width = $event; onChange()"
                [style.borderColor]="colors.fHoleStem" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">X <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.stem.center!.x, .25)"
                data-fine-step="0.25" min="0" [ngModel]="round2(params.fHoles!.stem.center!.x)"
                (ngModelChange)="params.fHoles!.stem.center!.x = $event; onChange()"
                [style.borderColor]="colors.fHoleStemOff" />
        </label>
        <label class="field-cell">
            <span class="field-title">Y <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.stem.center!.y, .25)"
                data-fine-step="0.25" min="0" [ngModel]="round2(params.fHoles!.stem.center!.y)"
                (ngModelChange)="params.fHoles!.stem.center!.y = $event; onChange()"
                [style.borderColor]="colors.fHoleStemOff" />
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Angle <span class="unit-label">°</span></span>
            <input type="number" class="basic-input" [step]="1" data-fine-step="0.1"
                [min]="stemAngleRange[0]" [max]="stemAngleRange[1]"
                [ngModel]="getStemAngleDeg(params.fHoles!.stem)"
                (ngModelChange)="setStemAngleDeg(params.fHoles!.stem, $event)"/>
        </label>
    </div>
</section>


<section class="ui-group" [style.border-color]="colors.fHoleLower">
    <div class="ui-group-title">Lower Eye</div>
    <div class="input-group basic-row field-row" role="group">

        <label class="field-cell">
            <span class="field-title">Radius <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.lower.eye!.r, .25)" data-fine-step="0.25"
                min="0" [ngModel]="round2(params.fHoles!.lower.eye!.r)"
                (ngModelChange)="params.fHoles!.lower.eye!.r = $event; onChange()"
                [style.borderColor]="colors.fHoleLower" />
        </label>
        <label class="field-cell"></label>
        <label class='field-cell'>
            <span class="field-title">FU to W</span>
            <div class="basic-display" aria-label="Upper bout to upper bout width ratio value">{{
                nearestSmallFraction(params.ratios.FLtoW) }}</div>
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">X <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.lower.eye!.x, .25)" data-fine-step="0.25"
                min="0" [ngModel]="round2(params.fHoles!.lower.eye!.x)"
                (ngModelChange)="params.fHoles!.lower.eye!.x = $event; onChange()"
                [style.borderColor]="colors.fHoleLowerOff" />
        </label>
        <label class="field-cell">
            <span class="field-title">Y <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.lower.eye!.y, .25)" data-fine-step="0.25"
                min="0" [ngModel]="round2(params.fHoles!.lower.eye!.y)"
                (ngModelChange)="params.fHoles!.lower.eye!.y = $event; onChange()"
                [style.borderColor]="colors.fHoleLowerOff" />
        </label>
    </div>


    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Rise <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.fHoles!.lower.rise, .25)" data-fine-step="0.25"
                min="0" [ngModel]="round2(params.fHoles!.lower.rise)"
                (ngModelChange)="params.fHoles!.lower.rise = $event; onChange()"/>
        </label>
    </div>
</section>
