<div class="view-toggle-bar">
    @if (showArcsRow) {
    <div class="vt-group">
        <button type="button" class="vt-btn" [class.active]="flags.showModuleArcs" (click)="toggle('showModuleArcs')"
            title="Show Module Arcs" aria-label="Show Module Arcs">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <path d="M4 19a15 15 0 0 1 15-15" />
                <line x1="4" y1="19" x2="19" y2="19" opacity="0.25" />
                <line x1="19" y1="4" x2="19" y2="19" opacity="0.25" />
            </svg>
        </button>
        @if (showAllArcs) {
        <button type="button" class="vt-sub" [class.active]="flags.showAllArcs" (click)="toggle('showAllArcs')"
            title="Show All Arcs (every module, not just the current one)" aria-label="Show All Arcs">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="13" height="13" rx="2" />
                <path d="M21 8v11a2 2 0 0 1-2 2H8" />
            </svg>
        </button>
        }
    </div>
    }

    <!-- Circle controls disabled for now — unused, may be removed later.
    @if (showCirclesRow) {
    <div class="vt-group">
        <button type="button" class="vt-btn" [class.active]="flags.showModuleCircles"
            (click)="toggle('showModuleCircles')" title="Show Module Circles" aria-label="Show Module Circles">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <circle cx="12" cy="12" r="8" />
            </svg>
        </button>
        @if (showAllCircles) {
        <button type="button" class="vt-sub" [class.active]="flags.showAllCircles" (click)="toggle('showAllCircles')"
            title="Show All Circles (every module, not just the current one)" aria-label="Show All Circles">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="13" height="13" rx="2" />
                <path d="M21 8v11a2 2 0 0 1-2 2H8" />
            </svg>
        </button>
        }
    </div>
    }
    -->

    @if (showGuideRow) {
    <button type="button" class="vt-btn" [class.active]="flags.showModuleGuides"
        (click)="toggle('showModuleGuides')" title="Show Module Guides" aria-label="Show Module Guides">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 2.5" />
            <line x1="12" y1="2" x2="12" y2="22" stroke-dasharray="2 2" />
            <line x1="2" y1="12" x2="22" y2="12" stroke-dasharray="2 2" />
        </svg>
    </button>
    }

    @if (showBlocksRow) {
    <button type="button" class="vt-btn" [class.active]="flags.showBlocks" (click)="toggle('showBlocks')"
        title="Show Corner Blocks" aria-label="Show Corner Blocks">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="4" rx="1" />
            <rect x="9" y="18" width="6" height="4" rx="1" />
            <rect x="2" y="9" width="5" height="6" rx="1" />
            <rect x="17" y="9" width="5" height="6" rx="1" />
        </svg>
    </button>
    }

    @if (showInnerPathRow) {
    <button type="button" class="vt-btn" [class.active]="flags.showInnerPath" (click)="toggle('showInnerPath')"
        title="Show Inner Path" aria-label="Show Inner Path">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="4" />
            <rect x="6.5" y="6.5" width="11" height="11" rx="2.5" stroke-dasharray="3 2.5" />
        </svg>
    </button>
    }

    @if (showOuterPathRow) {
    <button type="button" class="vt-btn" [class.active]="flags.renderOuterPath"
        (click)="toggle('renderOuterPath')" title="Show Outer Path" aria-label="Show Outer Path">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M4 19a15 15 0 0 1 15-15" />
            <path d="M8 19a11 11 0 0 1 11-11" stroke-dasharray="3 2.5" />
        </svg>
    </button>
    }
</div>
