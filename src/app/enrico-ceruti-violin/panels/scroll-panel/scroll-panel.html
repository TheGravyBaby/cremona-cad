@if (params.neck) {

<section class="ui-group" [style.border-color]="colors.neck">
    <div class="ui-group-title">Bounding Box</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Length <span class="unit-label">mm</span></span>
            <div class="basic-display" aria-label="Scroll length value">{{ neck.scrollLength | number:'1.1-1' }}</div>
        </label>
        <label class="field-cell">
            <span class="field-title">Depth <span class="unit-label">mm</span></span>
            <div class="basic-display" aria-label="Scroll depth value">{{ neck.scrollDepth | number:'1.1-1' }}</div>
        </label>
    </div>
</section>

}

@if (params.volute) {

<section class="ui-group" [style.border-color]="colors.outerTrace">
    <div class="ui-group-title">Volute</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Eye Radius <span class="unit-label">mm</span></span>
            <input class="basic-input" type="number" step="0.1" min="0.1" [style.border-color]="colors.outerTrace"
                [(ngModel)]="volute.eyeRadius" (input)="onChange()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Style</span>
            <select [style.border-color]="colors.outerTrace" [(ngModel)]="volute.style" (change)="onChange()">
                @for (s of styles; track s.id) {
                <option [value]="s.id">{{ s.label }}</option>
                }
            </select>
        </label>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title" title="Where the spiral leaves the eye, counterclockwise from its right side">Rotation <span class="unit-label">°</span></span>
            <input class="basic-input" type="number" step="1" [style.border-color]="colors.outerTrace"
                [(ngModel)]="volute.rotationDeg" (input)="onChange()" />
        </label>
    </div>
</section>

}
