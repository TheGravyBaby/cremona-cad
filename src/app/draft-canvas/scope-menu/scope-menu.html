<!-- The eye's own switch on top, then the four ways to say where else, one of them always lit:
     the three presets, or the full list for anything else (and for a panel you can't yet stand on). -->
<label class="scope-row scope-here">
  <input type="checkbox" [checked]="shownHere" (change)="toggleHere()" />
  <span>Show on this panel</span>
</label>
<div class="scope-modes">
  <button type="button" class="scope-row" [class.checked]="mode === 'everywhere'" (click)="applyPreset('everywhere')">
    <span class="scope-dot"></span><span>Everywhere</span>
  </button>
  <button type="button" class="scope-row" [class.checked]="mode === 'here'" (click)="applyPreset('here')">
    <span class="scope-dot"></span><span>Only this panel</span>
  </button>
  <button type="button" class="scope-row" [class.checked]="mode === 'nowhere'" (click)="applyPreset('nowhere')">
    <span class="scope-dot"></span><span>Nowhere</span>
  </button>
  <button type="button" class="scope-row" [class.checked]="mode === 'choose'" (click)="panelListOpen = !panelListOpen">
    <span class="scope-dot"></span><span>Choose panels</span>
    <span class="scope-caret" [class.open]="panelListOpen">&#x25BE;</span>
  </button>
  @if (panelListOpen) {
  <div class="panel-list">
    @for (panel of availablePanels; track panel.id) {
    <label class="panel-row" [class.current]="panel.id === activePanel">
      <input type="checkbox" [checked]="shownOn(panel.id)" (change)="togglePanel(panel.id)" />
      <span>{{ panel.label }}</span>
    </label>
    }
  </div>
  }
</div>
