<section class='ui-group'>
    <div class="ui-group-title">Button</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.button!.width, 1)" min="0" [(ngModel)]="params.button!.width"
                (input)="onChange()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Height <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.button!.height, 1)" min="0" [(ngModel)]="params.button!.height"
                (input)="onChange()" />
        </label>
        <button type="button" class="info-icon" (click)="buttonInfo()" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
</section>

<section class="ui-group">
    <div class="ui-group-title">Upper Corner</div>
    @if (params.options.useViolCornerUC) {
    <p class="viol-corner-notice">Viol corner selected — no cutoff options available.</p>
    } @else {
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Top Cutoff <span class="unit-label">°</span></span>
            @if (params.options.U31DoubleArc) {
            <input type="number" class="basic-input" [step]="stepFor(params.outerCorners.U31!.degreeDiff, 1)" [ngModel]="params.outerCorners.U31!.degreeDiff"
                (ngModelChange)="adjustArcEnd(params.outerCorners.U31!, $event, onChange.bind(this)); onArcFocus()"
                [style.borderColor]="colors.centerBoutUp"
                (focus)="onArcFocus()" (blur)="onArcBlur()" />
            } @else {
            <input type="number" class="basic-input" [step]="stepFor(params.outerCorners.U3!.degreeDiff, 1)" [ngModel]="params.outerCorners.U3!.degreeDiff"
                (ngModelChange)="adjustArcEnd(params.outerCorners.U3!, $event, onChange.bind(this)); onArcFocus()"
                [style.borderColor]="colors.centerBoutUp"
                (focus)="onArcFocus()" (blur)="onArcBlur()" />
            }
        </label>
        <label class="field-cell">
            <span class="field-title">Bottom Cutoff <span class="unit-label">°</span></span>
            @if (params.options.C21DoubleArc) {
            <input type="number" class="basic-input" [step]="stepFor(params.outerCorners.C21!.degreeDiff, 1)" [ngModel]="params.outerCorners.C21!.degreeDiff"
                (ngModelChange)="adjustArcEnd(params.outerCorners.C21!, $event, onChange.bind(this)); onArcFocus()"
                [style.borderColor]="colors.centerBoutUp"
                (focus)="onArcFocus()" (blur)="onArcBlur()" />
            } @else {
            <input type="number" class="basic-input" [step]="stepFor(params.outerCorners.C2!.degreeDiff, 1)" [ngModel]="params.outerCorners.C2!.degreeDiff"
                (ngModelChange)="adjustArcEnd(params.outerCorners.C2!, $event, onChange.bind(this)); onArcFocus()"
                [style.borderColor]="colors.centerBoutUp"
                (focus)="onArcFocus()" (blur)="onArcBlur()" />
            }
        </label>
        <button type="button" class="info-icon" (click)="cornerCutoffInfo()" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Rounding</span>
            <input type="number" class="basic-input" [step]="stepFor(params.options.ucCornerSharpness ?? 0, 0.01)" data-fine-step="0.01" min="0" max="1"
                [ngModel]="params.options.ucCornerSharpness ?? 0"
                (ngModelChange)="params.options.ucCornerSharpness = $event; onChange()" />
        </label>
    </div>
    }
</section>

    <p class="viol-corner-notice">Viol corner selected — no cutoff options available.</p>

                [style.borderColor]="colors.centerBoutLow"
                (focus)="onArcFocus()" (blur)="onArcBlur()" />

            <input type="number" class="basic-input" [step]="stepFor(params.outerCorners.C1!.degreeDiff, 1)" [ngModel]="params.outerCorners.C1!.degreeDiff"
                (ngModelChange)="adjustArcEnd(params.outerCorners.C1!, $event, onChange.bind(this)); onArcFocus()"
                [style.borderColor]="colors.centerBoutLow"

            }
        </label>
        <label class="field-cell">
            <span class="field-title">Bottom Cutoff <span class="unit-label">°</span></span>
            @if (params.options.L31DoubleArc) {
            <input type="number" class="basic-input" [step]="stepFor(params.outerCorners.L31!.degreeDiff, 1)" [ngModel]="params.outerCorners.L31!.degreeDiff"
                (ngModelChange)="adjustArcEnd(params.outerCorners.L31!, $event, onChange.bind(this)); onArcFocus()"
                [style.borderColor]="colors.centerBoutLow"
                (focus)="onArcFocus()" (blur)="onArcBlur(); " />
            } @else {
            <input type="number" class="basic-input" [step]="stepFor(params.outerCorners.L3!.degreeDiff, 1)" [ngModel]="params.outerCorners.L3!.degreeDiff"
                (ngModelChange)="adjustArcEnd(params.outerCorners.L3!, $event, onChange.bind(this)); onArcFocus()"

    </div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Rounding</span>
            <input type="number" class="basic-input" [step]="stepFor(params.options.lcCornerSharpness ?? 0, 0.01)" data-fine-step="0.01" min="0" max="1"
                [ngModel]="params.options.lcCornerSharpness ?? 0"
                (ngModelChange)="params.options.lcCornerSharpness = $event; onChange()" />
        </label>
    </div>
    }
</section>

<section class='ui-group'>
    <div class="ui-group-title">Purfling</div>
    <div class="input-group basic-row field-row" role="group">
        <label class="field-cell">
            <span class="field-title">Offset <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.purflingOffset, 0.1)" data-fine-step="0.25" min="0" [ngModel]="params.purflingOffset"
                (ngModelChange)="params.purflingOffset = $event; onChange()" />
        </label>
        <label class="field-cell">
            <span class="field-title">Width <span class="unit-label">mm</span></span>
            <input type="number" class="basic-input" [step]="stepFor(params.purflingChannelDepth, 0.1)" data-fine-step="0.25" min="0" [ngModel]="params.purflingChannelDepth"
                (ngModelChange)="params.purflingChannelDepth = $event; onChange()" />
        </label>
        <button type="button" class="info-icon" (click)="purflingInfo()" title="More information"
            aria-label="Information">ⓘ</button>
    </div>
</section>
