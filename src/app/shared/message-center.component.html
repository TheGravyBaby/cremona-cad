<!-- One countdown graphic for both states: the toast's dismiss ring and the chip's expiry ring are
     the same clock drawn at different sizes. The component decides duration and what ending means. -->
<ng-template #countdown let-m>
  <svg class="countdown-ring" viewBox="0 0 20 20" aria-hidden="true">
    <circle class="countdown-ring-track" cx="10" cy="10" [attr.r]="ringRadius"></circle>
    <circle
      class="countdown-ring-progress"
      cx="10"
      cy="10"
      [attr.r]="ringRadius"
      [attr.stroke-dasharray]="ringCircumference"
      (animationend)="onCountdownEnd(m)"
      [ngStyle]="countdownStyle(m)">
    </circle>
  </svg>
</ng-template>

<div class="message-center">
  <div class="toasts">
    <div *ngFor="let m of toasts(); trackBy: trackByMessageId" class="toast" [attr.data-severity]="m.severity">
      <div class="msg">
        <strong *ngIf="m.title">{{m.title}}</strong>
        <span>{{m.message}}</span>
      </div>
      <button class="dismiss" (click)="dismiss(m.id)" aria-label="Dismiss message">
        <ng-container *ngIf="hasCountdown(m)"
          [ngTemplateOutlet]="countdown"
          [ngTemplateOutletContext]="{$implicit: m}">
        </ng-container>
        <span class="dismiss-icon">✕</span>
      </button>
    </div>
  </div>

  <!-- titled messages. Folded, the ring round the ✕ is how long the chip has before it clears on
       its own; opened, the chip stays put and its message hangs beneath it. -->
  <div class="chips" *ngIf="chips().length">
    <div *ngFor="let m of chips(); trackBy: trackByChip"
      class="chip-wrap" [class.open]="!m.collapsed" [attr.data-severity]="m.severity">
      <div class="chip">
        <button class="chip-toggle" (click)="toggle(m)" [attr.aria-expanded]="!m.collapsed"
          [attr.title]="m.collapsed ? m.message : null">
          <span class="chip-label">{{m.title}}</span>
        </button>
        <button class="chip-close" (click)="close(m.id)" [attr.aria-label]="'Dismiss ' + m.title">
          <ng-container *ngIf="hasCountdown(m)"
            [ngTemplateOutlet]="countdown"
            [ngTemplateOutletContext]="{$implicit: m}">
          </ng-container>
          <span class="dismiss-icon">✕</span>
        </button>
      </div>
      <div class="chip-sheet" *ngIf="!m.collapsed">
        <span class="msg">{{m.message}}</span>
      </div>
    </div>
  </div>
</div>
